repos:
  # Pinned ruff version must stay reasonably close to the version in
  # pyproject.toml (currently ruff>=0.11) — drift triggers pre-existing
  # rule changes (UP038, E731 strictness) that the project's actual ruff
  # has already retired. Bump together when bumping either side.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy runs via the project's own uv env (matches what CI runs) and is
  # piped through mypy-baseline so pre-existing errors stay accepted and
  # only NET-NEW errors fail the commit. The baseline lives in
  # mypy-baseline.txt at the repo root; refresh it after a burndown PR with
  #   uv run mypy backend/ 2>&1 | uv run mypy-baseline sync
  # and commit the updated file.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (full backend/, filtered through mypy-baseline)
        language: system
        # Always check the whole backend/ tree, not just changed files —
        # per-file mypy only visits a partial import graph, which makes
        # mypy-baseline report unrelated baseline entries as "fixed" and
        # exit non-zero. Cost: ~10s per commit; benefit: matches CI exactly.
        entry: bash -c 'uv run mypy backend/ 2>&1 | uv run mypy-baseline filter'
        files: '^backend/.*\.py$'
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # syrupy snapshots embed the rendered SQL strings verbatim; many
        # of the repository templates align CASE WHEN / SELECT columns
        # with intentional trailing spaces. Trimming them desyncs the
        # snapshot from what the source actually emits on next render.
        exclude: '^tests/.*/__snapshots__/.*\.ambr$'
      - id: end-of-file-fixer
        # openapi-typescript emits openapi.json without a trailing newline;
        # end-of-file-fixer adds one, then the next regen-openapi run
        # strips it. Excluding the generated artifact breaks the cycle.
        exclude: '^frontend/openapi\.json$'
      - id: check-yaml
        # Docker Compose Override files use !reset / !override custom YAML
        # tags that PyYAML's default loader doesn't recognize. The compose
        # spec validates them at compose-time; the check-yaml hook would
        # falsely flag them here.
        exclude: '^docker-compose\.prod\.yml$'
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  # Secret scanner. Blocks commits that introduce credentials / API keys /
  # private keys / tokens. Configured via .gitleaks.toml at repo root
  # (extends gitleaks' default ruleset with this repo's allowlist for
  # tracked test fixtures and Rust lockfile checksums). Re-run with
  # `make secret-scan` locally; CI runs the same invocation.
  #
  # If a legitimate placeholder trips the scanner, suppress with:
  #   - inline `#gitleaks:allow` on the line, OR
  #   - add the file/path glob to .gitleaks.toml [allowlist] paths
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Regenerate the committed OpenAPI snapshot + typed frontend client
  # whenever the FastAPI surface or the generator script changes. Runs at
  # PRE-PUSH, not per-commit: when this fired on commit, a backend-only
  # change rewrote frontend/openapi.json + types mid-commit, so every
  # backend commit dirtied generated frontend files that then needed manual
  # re-staging — and on a shared branch with parallel frontend work it was
  # easy to sweep unrelated edits into the commit. At push, if the
  # regenerated files differ, the push fails and leaves them in the working
  # tree — commit them (`git add frontend/openapi.json frontend/types/api.generated.ts`)
  # and re-push. Requires `uv` and `npm` on PATH.
  - repo: local
    hooks:
      - id: regen-openapi
        name: Regenerate frontend/openapi.json + types
        files: ^(backend/.*\.py|scripts/generate_openapi\.py)$
        stages: [pre-push]
        language: system
        pass_filenames: false
        entry: bash -c 'cd frontend && npm run --silent gen:types'
      - id: typecheck-frontend
        name: Typecheck frontend
        files: ^frontend/.*\.(ts|tsx)$
        language: system
        pass_filenames: false
        entry: bash -c 'cd frontend && npx tsc --noEmit'

      # Run the Rust scorer's native unit tests before pushing a change to
      # compute/scorer/. The Python suite only pins the cross-language *tables*
      # (tests/scoring/test_normalize_parity.py); the cargo `#[test]`s pin the
      # normalize/cookie/matrix LOGIC + session-expiry boundaries that no Python
      # test exercises. Pre-push (not per-commit) keeps the compile off the hot
      # path; `files:` scopes it to scorer changes; skips with a notice if cargo
      # isn't installed (the Scorer CI job hard-requires it).
      - id: scorer-test
        name: Rust scorer unit tests (cargo test)
        files: ^compute/scorer/.*\.(rs|toml|lock)$
        stages: [pre-push]
        language: system
        pass_filenames: false
        entry: bash -c 'if command -v cargo >/dev/null || [ -x "$HOME/.cargo/bin/cargo" ]; then PATH="$HOME/.cargo/bin:$PATH" cargo test --manifest-path compute/scorer/Cargo.toml --locked; else echo "skipping scorer-test - cargo not on PATH (CI enforces it)"; fi'
