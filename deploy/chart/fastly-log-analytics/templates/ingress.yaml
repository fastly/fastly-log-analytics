{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "fastly-log-analytics.fullname" . }}
  labels:
    helm.sh/chart: {{ include "fastly-log-analytics.chart" . }}
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # Backend paths — mirrors the Caddyfile @api matcher
          # (/api/* /js/* /rum-beacon). /docs and /openapi.json are
          # deliberately NOT exposed publicly.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "fastly-log-analytics.fullname" $ }}-backend
                port:
                  number: 8000
          - path: /js
            pathType: Prefix
            backend:
              service:
                name: {{ include "fastly-log-analytics.fullname" $ }}-backend
                port:
                  number: 8000
          - path: /rum-beacon
            pathType: Prefix
            backend:
              service:
                name: {{ include "fastly-log-analytics.fullname" $ }}-backend
                port:
                  number: 8000
          # Frontend routes
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "fastly-log-analytics.fullname" $ }}-frontend
                port:
                  number: 3000
    {{- end }}
{{- end }}
