{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fastly-log-analytics.fullname" . }}-grafana-config
data:
  datasources.yml: |-
{{ .Files.Get "files/observability/grafana-datasources.yml" | indent 4 }}
  dashboards-provider.yml: |-
{{ .Files.Get "files/observability/grafana-dashboards.yml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fastly-log-analytics.fullname" . }}-grafana-dashboards
data:
{{ (.Files.Glob "files/observability/dashboards/*.json").AsConfig | indent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastly-log-analytics.fullname" . }}-grafana
  labels:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image | quote }}
          env:
            # Anonymous Admin, same as the docker-compose observability
            # sidecar -- safe here for the same reason it's safe there: the
            # access boundary is network-level (ClusterIP, no Ingress route
            # -- see this chart's README/values comment), reached only via
            # `kubectl port-forward`, matching every other admin surface in
            # this deployment. Not a substitute for real auth if this
            # Service is ever exposed beyond that.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: {{ .Values.observability.grafana.anonymousAdmin | quote }}
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: datasources.yml
            - name: config
              mountPath: /etc/grafana/provisioning/dashboards/fla.yml
              subPath: dashboards-provider.yml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            {{- toYaml .Values.observability.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "fastly-log-analytics.fullname" . }}-grafana-config
        - name: dashboards
          configMap:
            name: {{ include "fastly-log-analytics.fullname" . }}-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fastly-log-analytics.fullname" . }}-grafana
  labels:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # ClusterIP, deliberately no Ingress entry anywhere in this chart --
  # reach it with `kubectl port-forward svc/{{ include "fastly-log-analytics.fullname" . }}-grafana 3000:3000`.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 3000
      targetPort: http
{{- end }}
