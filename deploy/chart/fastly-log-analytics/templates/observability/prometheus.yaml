{{- $private := .Values.global.privateObservability.enabled }}
{{- if or .Values.observability.enabled $private }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fastly-log-analytics.fullname" . }}-prometheus-config
data:
  prometheus.yml: |-
{{- if $private }}
    global:
      scrape_interval: 15s
    scrape_configs: []
{{- else }}
{{ .Files.Get "files/observability/prometheus.yml" | indent 4 }}
  clickhouse.rules.yml: |-
{{ .Files.Get "files/observability/clickhouse.rules.yml" | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastly-log-analytics.fullname" . }}-prometheus
  labels:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  {{- if $private }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-prometheus
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- if $private }}
        fla.fastly.com/private-receiver: prometheus
        {{- end }}
        app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-prometheus
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if $private }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      {{- end }}
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image | quote }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # OTLP ingest for the app's own metrics; remote-write ingest for
            # Tempo's span-derived RED metrics -- same flags as the
            # docker-compose observability sidecar.
            - --web.enable-otlp-receiver
            {{- if $private }}
            - --storage.tsdb.retention.time=24h
            - --storage.tsdb.retention.size=512MB
            - --query.max-concurrency=2
            - --query.timeout=10s
            {{- else }}
            - --web.enable-remote-write-receiver
            {{- end }}
          {{- if $private }}
          env:
            - name: GOMEMLIMIT
              value: 384MiB
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          {{- end }}
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
            {{- if $private }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          resources:
            {{- toYaml .Values.observability.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "fastly-log-analytics.fullname" . }}-prometheus-config
        - name: data
          {{- if $private }}
          persistentVolumeClaim:
            claimName: {{ include "fastly-log-analytics.fullname" . }}-telemetry-prometheus
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Bare "prometheus" so tempo.yml's remote_write and Grafana's datasource
  # URL (both baked into the copied configs, not templated) resolve
  # correctly -- see files/observability/tempo.yml and
  # grafana-datasources.yml.
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 9090
      targetPort: http
{{- end }}
