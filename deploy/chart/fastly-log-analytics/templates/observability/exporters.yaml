{{/*
Service names here are bare (not release-prefixed) because
files/observability/prometheus.yml's scrape_configs are static, copied
verbatim from the docker-compose observability sidecar rather than
templated. Same tradeoff as the prometheus/tempo Services in this
directory: one release of this chart per namespace when
observability.enabled, matching docker-compose's own one-instance model.
*/}}
{{- if .Values.observability.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastly-log-analytics.fullname" . }}-redis-exporter
  labels:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-redis-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-redis-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-redis-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: redis-exporter
          image: {{ .Values.observability.exporters.redis.image | quote }}
          env:
            - name: REDIS_ADDR
              value: {{ .Values.observability.exporters.redis.address | quote }}
          ports:
            - name: http
              containerPort: 9121
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
spec:
  selector:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-redis-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 9121
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastly-log-analytics.fullname" . }}-postgres-exporter
  labels:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-postgres-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-postgres-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-postgres-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres-exporter
          image: {{ .Values.observability.exporters.postgres.image | quote }}
          env:
            - name: DATA_SOURCE_NAME
              value: {{ .Values.observability.exporters.postgres.dataSourceName | quote }}
          ports:
            - name: http
              containerPort: 9187
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
spec:
  selector:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-postgres-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 9187
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastly-log-analytics.fullname" . }}-celery-exporter
  labels:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-celery-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-celery-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-celery-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: celery-exporter
          image: {{ .Values.observability.exporters.celery.image | quote }}
          args:
            - "--broker-url={{ .Values.observability.exporters.celery.brokerUrl }}"
          ports:
            - name: http
              containerPort: 9808
---
apiVersion: v1
kind: Service
metadata:
  name: celery-exporter
spec:
  selector:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-celery-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 9808
      targetPort: http
{{- end }}
