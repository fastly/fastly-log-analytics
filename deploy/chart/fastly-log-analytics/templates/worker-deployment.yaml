{{- if .Values.workers.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fastly-log-analytics.fullname" . }}-worker
  labels:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-worker
    helm.sh/chart: {{ include "fastly-log-analytics.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.workers.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fastly-log-analytics.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}-backend:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - python
            - -m
            - backend.high_scale.worker
          env:
            {{- include "fastly-log-analytics.sharedEnv" . | nindent 12 }}
            - name: SSE_BACKPLANE
              value: {{ .Values.config.sseBackplane | quote }}
            - name: HIGH_SCALE_WORKER_THREADS
              value: {{ .Values.workers.env.HIGH_SCALE_WORKER_THREADS | default "1" | quote }}
            - name: HIGH_SCALE_MAX_BATCH_BYTES
              value: {{ .Values.workers.env.HIGH_SCALE_MAX_BATCH_BYTES | default "6291456" | quote }}
            - name: HIGH_SCALE_MAX_BATCH_OBJECTS
              value: {{ .Values.workers.env.HIGH_SCALE_MAX_BATCH_OBJECTS | default "10" | quote }}
            - name: HIGH_SCALE_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- include "fastly-log-analytics.otelEnv" . | nindent 12 }}
          {{- with .Values.workers.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "fastly-log-analytics.dataVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "fastly-log-analytics.dataVolumes" . | nindent 8 }}
{{- end }}
