{{- if include "fastly-log-analytics.managedSecret" . -}}
# Chart-managed Secret for connection strings. Values-provided strings stay
# readable to anyone with helm/release access — production should pre-create
# a Secret (keys: METADATA_DSN, CELERY_BROKER_URL, CLICKHOUSE_PASSWORD) and set
# secrets.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fastly-log-analytics.secretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "fastly-log-analytics.name" . }}
    helm.sh/chart: {{ include "fastly-log-analytics.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- if .Values.secrets.celeryBrokerUrl }}
  CELERY_BROKER_URL: {{ .Values.secrets.celeryBrokerUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.metadataDsn }}
  METADATA_DSN: {{ .Values.secrets.metadataDsn | quote }}
  {{- end }}
  {{- if .Values.secrets.clickhousePassword }}
  CLICKHOUSE_PASSWORD: {{ .Values.secrets.clickhousePassword | quote }}
  {{- end }}
{{- end }}
