global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/clickhouse.rules.yml
# No docker/cAdvisor-equivalent job here: docker-compose's
# docker-stats-exporter talks to the Docker Engine API directly, which
# doesn't exist in Kubernetes. A kubelet-cAdvisor scrape job would be the
# k8s equivalent but needs its own ClusterRole (node metrics access) --
# left as a known gap rather than half-built; container CPU/mem is
# reasonably covered by `kubectl top pods` in the meantime.
scrape_configs:
  - job_name: valkey
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: celery
    static_configs: [{ targets: ["celery-exporter:9808"] }]
