{{- if .Values.networkPolicy.enabled }}
{{- range $workload, $config := .Values.workloads }}
{{- if $config.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "high-scale.workloadName" (dict "root" $ "workload" $workload) }}
  labels:
    {{- include "high-scale.workloadLabels" (dict "root" $ "workload" $workload) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "high-scale.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $workload }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "high-scale.name" $ }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
  {{- with $.Values.networkPolicy.ingressFrom }}
        {{- toYaml . | nindent 8 }}
  {{- end }}
  egress:
    {{- if $.Values.networkPolicy.allowClusterDns }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with $.Values.networkPolicy.egressTo }}
    - to:
        {{- toYaml . | nindent 8 }}
    {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
