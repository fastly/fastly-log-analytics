# This subchart is enabled through the parent chart's highScale.enabled flag.
# It packages application workloads only. ClickHouse/Keeper remain owned by
# the operator/chart selected by the platform team and are reached through
# operator-provided Services and Secrets.
enabled: false

global:
  privateObservability:
    enabled: false

image:
  repository: fastly-log-analytics-high-scale
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

secret:
  # Prefer an operator-managed Secret in production. The chart never invents
  # ClickHouse/Keeper connection values.
  existingName: ""
  create: false
  stringData: {}

env:
  - name: OTEL_EXPORTER
    value: prometheus
  - name: HIGH_SCALE_WORKER_THREADS
    value: "1"
  - name: HIGH_SCALE_MAX_BATCH_BYTES
    value: "6291456"
  - name: HIGH_SCALE_MAX_BATCH_OBJECTS
    value: "10"

# A deterministic identity lets a replacement pod recover leases left by the
# previous pod instead of deriving a new identity from its process ID.
workerId: ""

sharedState:
  # Required for high-scale workloads: this must be the same PVC mounted by
  # the parent chart's backend and workers.
  existingClaim: ""
  # Set true only for explicitly ephemeral development runs.
  emptyDir: false
  configSubPath: configs
  dataSubPath: data

podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '8000'
  prometheus.io/path: '/metrics'


podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

# Fairness is intentionally expressed as scheduling policy, not as an
# application/runtime mode. Operators can tune these per environment without
# changing the existing standard/high_scale startup paths.
workloadFairness:
  priorityClassName: ""
  topologySpreadConstraints: []
  podAntiAffinity:
    enabled: true
    topologyKey: kubernetes.io/hostname
    required: false

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowClusterDns: true
  ingressFrom: []
  egressTo: []

workloads:
  ingest:
    enabled: true
    replicas: 2
    command: ["python", "-m", "backend.high_scale.worker"]
    args: []
    resources: {}
  archive:
    # The archive/replay/control-plane entrypoints are not implemented as
    # standalone processes yet. Keep them disabled rather than starting the
    # image's API command under the wrong workload identity.
    enabled: false
    replicas: 2
    command: []
    args: []
    resources: {}
  query:
    enabled: false
    replicas: 2
    command: []
    args: []
    resources: {}
  replay:
    enabled: false
    replicas: 1
    command: []
    args: []
    resources: {}
  control-plane:
    enabled: false
    replicas: 2
    command: []
    args: []
    resources: {}
