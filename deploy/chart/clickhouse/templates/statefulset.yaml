{{- include "clickhouse.validate" . -}}
{{- range $s := until (int .Values.shards) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse.fullname" $ }}-shard-{{ $s }}
  labels:
    {{- include "clickhouse.labels" $ | nindent 4 }}
    app.kubernetes.io/component: clickhouse
    app.kubernetes.io/shard: {{ printf "%02d" (add $s 1) }}
spec:
  serviceName: {{ include "clickhouse.fullname" $ }}-headless
  replicas: {{ $.Values.replicas }}
  selector:
    matchLabels:
      {{- include "clickhouse.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: clickhouse
      app.kubernetes.io/shard: {{ printf "%02d" (add $s 1) }}
  template:
    metadata:
      labels:
        {{- include "clickhouse.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: clickhouse
        app.kubernetes.io/shard: {{ printf "%02d" (add $s 1) }}
    spec:
      serviceAccountName: {{ include "clickhouse.fullname" $ }}
      securityContext:
        fsGroup: 3000
        runAsGroup: 3000
        runAsNonRoot: true
        runAsUser: 3000
      initContainers:
      - name: init-macros
        image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
        command:
        - sh
        - -c
        - |
          ORDINAL=$(echo "$HOSTNAME" | awk -F'-' '{print $NF}')
          REPLICA=$(printf "%02d" $((ORDINAL + 1)))
          sed "s/{replica}/$REPLICA/g" /etc/clickhouse-macros-source/macros.xml > /etc/clickhouse-macros-dest/macros.xml
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: macros-source
          mountPath: /etc/clickhouse-macros-source
        - name: macros-dest
          mountPath: /etc/clickhouse-macros-dest
        - name: tmp
          mountPath: /tmp
      containers:
      - name: clickhouse
        image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ $.Values.service.httpPort }}
        - name: tcp
          containerPort: {{ $.Values.service.tcpPort }}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CLICKHOUSE_DB
          valueFrom:
            secretKeyRef:
              name: {{ include "clickhouse.secretName" $ }}
              key: CLICKHOUSE_DB
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "clickhouse.secretName" $ }}
              key: CLICKHOUSE_USER
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "clickhouse.secretName" $ }}
              key: CLICKHOUSE_PASSWORD
        - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
          value: "1"
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /var/log/clickhouse-server
        - name: etc
          mountPath: /etc/clickhouse-server/users.d
        - name: config
          mountPath: /etc/clickhouse-server/config.d/logger-override.xml
          subPath: logger-override.xml
        - name: config
          mountPath: /etc/clickhouse-server/config.d/dedup.xml
          subPath: dedup.xml
        - name: config
          mountPath: /etc/clickhouse-server/config.d/system-logs.xml
          subPath: system-logs.xml
        {{- if or $.Values.keeper.enabled (or (gt (int $.Values.shards) 1) (gt (int $.Values.replicas) 1)) }}
        - name: config
          mountPath: /etc/clickhouse-server/config.d/remote-servers.xml
          subPath: remote-servers.xml
        {{- end }}
        - name: macros-dest
          mountPath: /etc/clickhouse-server/config.d/macros.xml
          subPath: macros.xml
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: logs
        emptyDir:
          sizeLimit: 1Gi
      - name: etc
        emptyDir:
          sizeLimit: 1Gi
      - name: macros-dest
        emptyDir:
          sizeLimit: 64Ki
      - name: macros-source
        configMap:
          name: {{ include "clickhouse.fullname" $ }}-shard-{{ $s }}-macros
      - name: config
        configMap:
          name: {{ include "clickhouse.fullname" $ }}-config
      {{- if not $.Values.persistence.enabled }}
      - name: data
        emptyDir: {}
      {{- end }}
  {{- if $.Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if $.Values.persistence.storageClass }}
      storageClassName: {{ $.Values.persistence.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ $.Values.persistence.size }}
  {{- end }}
---
{{- end }}
