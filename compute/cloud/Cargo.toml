[package]
name = "fastly-logs-parquet-shell"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false

[[bin]]
name = "shell-test-server"
path = "src/test_server.rs"

[lib]
name = "fastly_log_analytics"

[[bin]]
name = "flp"
path = "src/main.rs"
