[workspace]
members = ["cloud", "scorer", "common"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
aes-gcm = "0.10"
ahash = "0.8.12"
arrow-array = "=60.1.0"
arrow-schema = "=60.1.0"
base64 = "0.23.1"
brotli = "8"
bytes = "1"
ciborium = "0.2.2"
cookie = "0.18"
coset = "0.3"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
fastly = "=0.13.2"
flate2 = "1"
getrandom = "0.2"
hex = "0.4"
hmac = "0.13.0"
md-5 = "0.11.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
parquet = { version = "=60.1.0", default-features = false, features = ["arrow", "snap", "zstd"] }
percent-encoding = "2.3.2"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
subtle = "2.6.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tiny_http = "0.12"
url = "2.5.7"
zstd = { version = "0.14.3", default-features = false }

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# Full debuginfo in every test binary is what made target/ reach 70 GB; line tables keep file:line backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
strip = true
