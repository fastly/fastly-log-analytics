# ─────────────────────────────────────────────────────────────────────────────
# LOCAL-DEV TOPOLOGY ONLY — do not point real traffic at this file.
#
# Every published port below binds 127.0.0.1 on purpose: the multipod stack is
# a workstation topology for exercising the Celery/valkey split locally. To
# expose it for real you must, at minimum:
#   1. Put a TLS-terminating, authenticated ingress in front (see
#      docker-compose.prod.yml + Caddyfile for the production pattern).
#   2. Keep TRUSTED_PROXY_IPS / UVICORN_FORWARDED_ALLOW_IPS pinned to the
#      proxy's real source subnet — NEVER `*`. The backend refuses to boot on
#      a wildcard (backend/main.py:_enforce_proxy_headers_configured).
#   3. Keep valkey unpublished — pods reach it on the compose network; add a
#      local compose override if you need host access for debugging.
#
# The app network uses a FIXED subnet (172.28.0.0/16) so the proxy-trust
# envs below are pinned to the network Caddy actually egresses from rather
# than a guess at Docker's default pool.
# ─────────────────────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
    ipam:
      config:
      - subnet: 172.28.0.0/16
services:
  backend:
    image: &backend-image fastly-log-analytics-backend:latest
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    # Run tini as PID 1 so orphaned children are reaped — see the base
    # docker-compose.yml backend for the zombie-wedge-on-force-recreate
    # rationale that aborts the deploy under set -e.
    init: true
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      metadata-schema-init:
        condition: service_completed_successfully
    environment:
    - PYTHONUNBUFFERED=1
    - LOCAL_HOSTS=fastly.localhost,fastly.analytics
    # Trust XFF only from the pinned compose subnet (Caddy's egress network).
    # A wildcard here lets any direct client spoof its IP and become
    # loopback-admin — the backend hard-fails boot on `*`.
    - TRUSTED_PROXY_IPS=172.28.0.0/16
    - UVICORN_FORWARDED_ALLOW_IPS=172.28.0.0/16
    # Admin trust for this containerized topology: nothing reaches the
    # backend over loopback here (operator traffic lands as the docker
    # gateway IP, SSR as the frontend container IP), so the isolated compose
    # subnet is declared admin-trusted. Sound ONLY because the sole ingress
    # is Caddy bound to 127.0.0.1 (see header comment) — never widen this
    # beyond the compose network.
    - LOCAL_ADMIN_CIDRS=172.28.0.0/16
    - CELERY_BROKER_URL=redis://valkey:6379/0
    - FLA_PRODUCTION=${FLA_PRODUCTION:-0}
    # All operational metadata (cron leases, ingest ledger, ingested-file
    # manifests, alerts, views, usage logs) lives in shared PostgreSQL 16
    # (ADR-22).
    - &metadata-dsn METADATA_DSN=postgresql://fla:${POSTGRES_PASSWORD:-fla_local_dev}@postgres:5432/fla
    - &clickhouse-url CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
    - CLICKHOUSE_ENABLED=true
    - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
    - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
    - CLICKHOUSE_USER=${CLICKHOUSE_USER:-fla}
    - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-fla_local_dev}
    - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-fla}
    - CLICKHOUSE_SECURE=${CLICKHOUSE_SECURE:-false}
    # Pass through DEBUG_RESPONSES from the host env (defaults to true) —
    # without it the backend redacts the _debug_queries envelopes and the
    # dashboard Debug Panel shows 0 queries.
    - DEBUG_RESPONSES=${DEBUG_RESPONSES:-true}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
    - app-network
    restart: unless-stopped
    stop_grace_period: 75s
    volumes:
    - ./configs:/app/configs
    # Keep pod-local staging files out of the host sync topology.
    # All durable metadata and ingest state is in Postgres/ClickHouse/FOS.
    - multipod-data:/app/data
  caddy:
    extends:
      file: docker-compose.common.yml
      service: caddy
    depends_on:
    - backend
    networks:
    - app-network
    ports:
    # Loopback-only: local-dev topology (see header comment).
    - 127.0.0.1:80:80
    volumes:
    - ./caddy/Caddyfile.multipod:/etc/caddy/Caddyfile:ro
  frontend:
    extends:
      file: docker-compose.common.yml
      service: frontend
    environment:
    # SSR talks to the backend service directly — routing it through Caddy
    # would classify server-side requests through the public proxy path.
    - API_PROXY_URL=http://backend:8000
    - NODE_OPTIONS=--max_old_space_size=1024
    - ENV_NAME=multipod-dev
    networks:
    - app-network
  postgres:
    extends:
      file: docker-compose.common.yml
      service: postgres
    image: postgres:16-alpine
    # max_connections raised from the default 100: the metadata pool is sized
    # per PROCESS (METADATA_PG_POOL_MAX, default 32) and backend + worker
    # each hold their own.
    command:
    - postgres
    - -c
    - max_connections=300
    # Local-dev credentials only (see header comment; defined in
    # docker-compose.common.yml) — override with POSTGRES_PASSWORD for
    # anything beyond a workstation.
    healthcheck:
      timeout: 3s
    networks:
    - app-network
    # No published ports on purpose: pods reach it on the compose network.
    volumes:
    - pgdata:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    environment:
    - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-fla}
    - CLICKHOUSE_USER=${CLICKHOUSE_USER:-fla}
    - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-fla_local_dev}
    - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
    - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
    - app-network

  valkey:
    image: valkey/valkey:8.0
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
    - app-network
    # No published ports on purpose: pods reach valkey on the compose
    # network. Add a local compose override if you need host access.
    restart: unless-stopped

  metadata-schema-init:
    image: *backend-image
    build: *backend-build
    # One-shot: initializes the PostgreSQL 16 metadata schema before backend
    # and worker pods start serving traffic. Idempotent (every statement is
    # CREATE ... IF NOT EXISTS and nothing is dropped), so it re-runs
    # harmlessly on each `up` against a populated database.
    command: ["python", "scripts/setup_pg_schema.py"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
    - PYTHONUNBUFFERED=1
    # scripts/ is not a package and /app is not on sys.path in the image.
    - PYTHONPATH=/app
    - *metadata-dsn
    networks:
    - app-network
    healthcheck:
      disable: true
    restart: "no"
    volumes:
    # scripts/setup_pg_schema.py is also baked into the runtime image; mounting
    # ./scripts here keeps local-dev edits immediately visible without rebuild.
    - ./scripts:/app/scripts:ro

  worker:
    image: *backend-image
    build: *backend-build
    # Run tini as PID 1 so orphaned children are reaped — see the base
    # docker-compose.yml backend for the zombie-wedge rationale.
    init: true
    command: ["python", "-m", "backend.high_scale.worker"]
    mem_limit: 2g
    memswap_limit: 2g
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      metadata-schema-init:
        condition: service_completed_successfully
    environment:
    - PYTHONUNBUFFERED=1
    - CELERY_BROKER_URL=redis://valkey:6379/0
    - FLA_PRODUCTION=${FLA_PRODUCTION:-0}
    - HIGH_SCALE_WORKER_THREADS=1
    - HIGH_SCALE_MAX_BATCH_BYTES=6291456
    - HIGH_SCALE_MAX_BATCH_OBJECTS=10
    - *metadata-dsn
    - *clickhouse-url
    - CLICKHOUSE_ENABLED=true
    - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
    - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
    - CLICKHOUSE_USER=${CLICKHOUSE_USER:-fla}
    - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-fla_local_dev}
    - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-fla}
    - CLICKHOUSE_SECURE=${CLICKHOUSE_SECURE:-false}
    networks:
    - app-network
    restart: unless-stopped
    volumes:
    - ./configs:/app/configs
    - multipod-data:/app/data

volumes:
  multipod-data:
  pgdata:
  clickhouse-data:
