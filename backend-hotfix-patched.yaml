      \ ValueError(\\\"CLICKHOUSE_DATABASE must be a simple identifier\\\")\\n   \
      \ if not re.fullmatch(r\\\"[A-Za-z0-9_.@-]{1,128}\\\", required[\\\"USER\\\"\
      ]):\\n        raise ValueError(\\\"CLICKHOUSE_USER contains unsupported characters\\\
      \")\\n    secure = _clickhouse_bool(\\\"CLICKHOUSE_SECURE\\\", \\\"true\\\"\
      )\\n    password = os.getenv(\\\"CLICKHOUSE_PASSWORD\\\", \\\"\\\")\\n    if\
      \ not password.strip() and (secure or not loopback):\\n        raise ValueError(\\\
      \"CLICKHOUSE_PASSWORD is required except for explicit HTTP loopback tests\\\"\
      )\\n    query_timeout = _clickhouse_number(\\\"CLICKHOUSE_QUERY_TIMEOUT_S\\\"\
      , 30, 300)\\n    return ClickHouseConfig(\\n        host=host,\\n        port=_clickhouse_number(\\\
      \"CLICKHOUSE_PORT\\\", 8443 if secure else 8123, 65535, integer=True),\\n  \
      \      database=required[\\\"DATABASE\\\"],\\n        user=required[\\\"USER\\\
      \"],\\n        password=password,\\n        secure=secure,\\n        connect_timeout_s=_clickhouse_number(\\\
      \"CLICKHOUSE_CONNECT_TIMEOUT_S\\\", 5, 60),\\n        query_timeout_s=query_timeout,\\\
      n        insert_timeout_s=_clickhouse_number(\\\"CLICKHOUSE_INSERT_TIMEOUT_S\\\
      \", query_timeout, 300),\\n        pool_timeout_s=_clickhouse_number(\\\"CLICKHOUSE_POOL_TIMEOUT_S\\\
      \", 5, 60),\\n        pool_max_size=_clickhouse_number(\\\"CLICKHOUSE_POOL_MAX_SIZE\\\
      \", 8, 64, integer=True),\\n    )\\n\\n\\n# Cache for Fastly service names:\
      \ {service_id: {\\\"name\\\": str, \\\"fetched_at\\\": float}}\\n_name_cache:\
      \ dict = {}\\n_name_cache_lock = threading.Lock()\\n_name_refresh_in_flight:\
      \ set[str] = set()\\n_name_refresh_lock = threading.Lock()\\n_NAME_CACHE_TTL\
      \ = 300  # 5 minutes\\n\\n# Cache for parsed configs: {service_id: (mtime_ns,\
      \ parsed_dict)}.\\n# Revalidated by stat() on each load_config call AND explicitly\
      \ invalidated\\n# by save_config \u2014 mtime alone is not enough because Linux\
      \ ext4/tmpfs can\\n# produce identical st_mtime_ns for two writes within the\
      \ same microsecond.\\n# Hot paths (sync-status polls, every cron tick, every\
      \ dashboard request)\\n# hit this enough that skipping the open+read on the\
      \ no-change path adds up.\\n_config_cache: dict[str, tuple[int, dict]] = {}\\\
      n_config_cache_lock = threading.Lock()\\n\\n# Path-keyed memo for _ensure_dirs().\
      \ Called from every list_configs /\\n# save_config / save_usage_logging_config\
      \ so the mkdir(exist_ok=True)\\n# syscall storm shows up under load. Tests that\
      \ monkeypatch CONFIGS_DIR\\n# get fresh entries because the tmp_path is a different\
      \ Path object.\\n_ensured_dirs: set[Path] = set()\\n\\n\\ndef _ensure_dirs():\\\
      n    dirs = (CONFIGS_DIR, DATA_DIR, SERVICES_DATA_DIR, NGWAF_DATA_DIR, CACHE_DATA_DIR,\
      \ SYSTEM_DATA_DIR)\\n    missing = [d for d in dirs if d not in _ensured_dirs]\\\
      n    if not missing:\\n        return\\n    for d in missing:\\n        d.mkdir(exist_ok=True)\\\
      n        _ensured_dirs.add(d)\\n\\n\\n# Alphabet shared with backend.deps.ServiceId.\
      \ Public so the FastAPI\\n# Path validator can reuse the same pattern instead\
      \ of redefining it.\\nSERVICE_ID_PATTERN = r\\\"^[A-Za-z0-9_-]+$\\\"\\n_SERVICE_ID_RE\
      \ = re.compile(SERVICE_ID_PATTERN)\\n_SERVICE_ID_MAX_LEN = 64\\n\\n\\ndef _validate_service_id(service_id:\
      \ str) -\\u003e str:\\n    \\\"\\\"\\\"Security: defense in depth against path\
      \ traversal in any helper\\n    that builds a path from ``service_id``.\\n\\\
      n    Real Fastly service IDs are opaque 22-char alphanumeric strings, but the\\\
      n    test suite and a handful of legacy provisioning paths use hyphenated\\\
      n    IDs like ``svc-1`` / ``test-service-id``. The regex therefore accepts\\\
      n    ``[A-Za-z0-9_-]+`` \u2014 every character allowed is safe inside a filename\\\
      n    and contains no path-separator / dot / null-byte. Without this,\\n    ``service_id=\\\
      \"/etc/passwd\\\"`` or ``service_id=\\\"../../tmp/x\\\"`` would\\n    compose\
      \ with ``pathlib`` semantics \u2014 absolute paths discard the base\\n    entirely,\
      \ relative ``..`` traverses out, and ``\\\\\\\\x00`` truncates on\\n    some\
      \ kernels.\\n\\n    Length cap (64) is well above the longest legitimate Fastly\
      \ ID (22)\\n    and bounds memory in error-logging paths.\\n    \\\"\\\"\\\"\
      \\n    if not isinstance(service_id, str):\\n        raise ValueError(f\\\"\
      invalid service_id type {type(service_id).__name__}: must be str (security)\\\
      \")\\n    if not service_id or len(service_id) \\u003e _SERVICE_ID_MAX_LEN:\\\
      n        raise ValueError(\\n            f\\\"invalid service_id length {len(service_id)\
      \ if service_id else 0}: \\\"\\n            f\\\"1..{_SERVICE_ID_MAX_LEN} characters\
      \ required (security)\\\"\\n        )\\n    if not _SERVICE_ID_RE.match(service_id):\\\
      n        raise ValueError(f\\\"invalid service_id {service_id!r}: must be alphanumeric\
      \ / dash / underscore (security)\\\")\\n    return service_id\\n\\n\\ndef config_path(service_id:\
      \ str) -\\u003e Path:\\n    _validate_service_id(service_id)\\n    return CONFIGS_DIR\
      \ / f\\\"{service_id}.json\\\"\\n\\n\\ndef duckdb_path(service_id: str) -\\\
      u003e str:\\n    _validate_service_id(service_id)\\n    return str(SERVICES_DATA_DIR\
      \ / f\\\"{service_id}.duckdb\\\")\\n\\n\\ndef load_config(service_id: str |\
      \ None) -\\u003e dict | None:\\n    \\\"\\\"\\\"Load a single service config\
      \ by ID. Returns None if not found.\\n\\n    Returns a freshly-parsed dict on\
      \ every call \u2014 callers that mutate the\\n    result (e.g. update_status)\
      \ won't poison the cache. The on-disk file is\\n    revalidated via st_mtime_ns,\
      \ so external edits and save_config writes\\n    are picked up on the next call\
      \ without explicit invalidation.\\n\\n    Returns ``None`` (not a raised exception)\
      \ for invalid service IDs,\\n    including ``None`` itself \u2014 several call\
      \ sites in the iceberg/\\n    submodules pass ``src.get(\\\"name\\\")`` (typed\
      \ as ``Any | None``) and\\n    rely on the None response to mean \\\"no config\\\
      \". Security's validation\\n    in ``config_path`` is still what blocks path-traversal;\
      \ this just\\n    makes the helper friendlier at call sites that don't pre-validate.\\\
      n    \\\"\\\"\\\"\\n    if service_id is None:\\n        return None\\n    try:\\\
      n        path = config_path(service_id)\\n    except ValueError:\\n        return\
      \ None\\n    try:\\n        mtime_ns = path.stat().st_mtime_ns\\n    except\
      \ FileNotFoundError:\\n        return None\\n\\n    cached = _config_cache.get(service_id)\\\
      n    if cached is not None and cached[0] == mtime_ns:\\n        return copy.deepcopy(cached[1])\\\
      n\\n    with open(path, \\\"rb\\\") as f:\\n        raw = f.read()\\n    parsed\
      \ = json.loads(raw)\\n    with _config_cache_lock:\\n        _config_cache[service_id]\
      \ = (mtime_ns, parsed)\\n    return copy.deepcopy(parsed)\\n\\n\\ndef _atomic_write_json(path,\
      \ data: dict) -\\u003e None:\\n    \\\"\\\"\\\"Write ``data`` to ``path`` atomically\
      \ (unique tmp file + os.replace).\\n\\n    Shared by :func:`save_config` and\
      \ :func:`save_usage_logging_config`,\\n    which used to paste identical mkstemp\
      \ / fdopen / json.dump / os.replace\\n    blocks. Uses a UNIQUE tmp file (per-call\
      \ random suffix) so concurrent\\n    callers cannot clobber each other's tmp\
      \ file mid-write. The shared-tmp\\n    variant produced corrupted JSON (a stray\
      \ ``}`` appended to the rendered\\n    file) and bricked the backend on next\
      \ read; we hit it twice in one\\n    debugging session before fixing.\\n   \
      \ \\\"\\\"\\\"\\n    fd, tmp_path = tempfile.mkstemp(prefix=f\\\".{path.name}.\\\
      \", suffix=\\\".tmp\\\", dir=str(path.parent))\\n    try:\\n        with os.fdopen(fd,\
      \ \\\"w\\\") as f:\\n            json.dump(data, f, indent=2)\\n        os.replace(tmp_path,\
      \ path)\\n    except Exception:\\n        try:\\n            os.unlink(tmp_path)\\\
      n        except OSError:\\n            pass\\n        raise\\n\\n\\ndef save_config(service_id:\
      \ str, cfg: dict):\\n    \\\"\\\"\\\"Write a service config atomically. See\
      \ :func:`_atomic_write_json`.\\\"\\\"\\\"\\n    global _cdn_service_id_map\\\
      n    _ensure_dirs()\\n    if \\\"created_at\\\" not in cfg or not cfg[\\\"created_at\\\
      \"]:\\n        import datetime as _dt\\n\\n        cfg[\\\"created_at\\\"] =\
      \ _dt.datetime.now(_dt.UTC).isoformat()\\n    try:\\n        _atomic_write_json(config_path(service_id),\
      \ cfg)\\n    except (OSError, PermissionError) as e:\\n        if getattr(e,\
      \ \\\"errno\\\", None) == 30 or \\\"read-only\\\" in str(e).lower():\\n    \
      \        logger.warning(\\\"save_config_skipped_read_only_fs service_id=%s:\
      \ %s\\\", service_id, e)\\n            return\\n        raise\\n    # Invalidate\
      \ the load_config cache. The cache uses st_mtime_ns as its\\n    # revalidation\
      \ key, which is normally fine \u2014 but on Linux ext4/tmpfs two\\n    # os.replace()\
      \ calls within the same microsecond can produce identical\\n    # mtime_ns values,\
      \ so a cached (old_mtime, old_raw) entry can stay\\n    # \\\"fresh\\\" after\
      \ this write and serve stale bytes. update_status() does\\n    # exactly that:\
      \ load \u2192 mutate \u2192 save \u2192 and the next load can see the\\n   \
      \ # pre-mutation cached copy. Drop the entry so the next load re-reads.\\n \
      \   with _config_cache_lock:\\n        _config_cache.pop(service_id, None)\\\
      n    _cdn_service_id_map = None\\n\\n\\ndef update_status(service_id: str, status:\
      \ dict):\\n    \\\"\\\"\\\"Partially update the 'status' section of a service\
      \ config.\\\"\\\"\\\"\\n    cfg = load_config(service_id)\\n    if not cfg:\\\
      n        return\\n\\n    current_status = cfg.get(\\\"status\\\", {})\\n   \
      \ current_status.update(status)\\n    current_status[\\\"updated_at\\\"] = time.time()\\\
      n    cfg[\\\"status\\\"] = current_status\\n    save_config(service_id, cfg)\\\
      n\\n\\ndef get_status(service_id: str) -\\u003e dict:\\n    \\\"\\\"\\\"Return\
      \ the 'status' section of a service config.\\\"\\\"\\\"\\n    cfg = load_config(service_id)\\\
      n    if not cfg:\\n        return {}\\n    return cfg.get(\\\"status\\\", {})\\\
      n\\n\\ndef delete_config(service_id: str):\\n    \\\"\\\"\\\"Remove a service\
      \ config file.\\\"\\\"\\\"\\n    global _cdn_service_id_map\\n    path = config_path(service_id)\\\
      n    if path.exists():\\n        path.unlink()\\n    _cdn_service_id_map = None\\\
      n    with _config_cache_lock:\\n        _config_cache.pop(service_id, None)\\\
      n\\n\\n_cdn_service_id_map: dict[str, str] | None = None\\n\\n\\ndef get_cdn_service_id_map()\
      \ -\\u003e dict[str, str]:\\n    \\\"\\\"\\\"Return a mapping of CDN service\
      \ IDs to their logging service IDs. Memoized.\\\"\\\"\\\"\\n    global _cdn_service_id_map\\\
      n    if _cdn_service_id_map is not None:\\n        return _cdn_service_id_map\\\
      n\\n    m = {}\\n    for c in list_configs():\\n        cdn_sid = c.get(\\\"\
      cdn_service_id\\\")\\n        if cdn_sid:\\n            m[cdn_sid] = c[\\\"\
      service_id\\\"]\\n    _cdn_service_id_map = m\\n    return m\\n\\n\\ndef list_service_ids()\
      \ -\\u003e list[str]:\\n    \\\"\\\"\\\"Return all configured service IDs (sorted).\\\
      \"\\\"\\\"\\n    _ensure_dirs()\\n    return sorted(p.stem for p in CONFIGS_DIR.glob(\\\
      \"*.json\\\"))\\n\\n\\ndef list_configs() -\\u003e list[dict]:\\n    \\\"\\\"\
      \\\"Return all service configs as a list, sorted by service ID.\\\"\\\"\\\"\\\
      n    return [c for sid in list_service_ids() if (c := load_config(sid)) is not\
      \ None]\\n\\n\\ndef get_active_service_id(fallback_to_first: bool = True) -\\\
      u003e str | None:\\n    \\\"\\\"\\\"Return the first configured service ID as\
      \ a fallback default.\\n\\n    The actual active service is tracked client-side\
      \ in localStorage and\\n    passed via the ?service= query param. This is used\
      \ server-side when\\n    no service is specified (e.g. health checks, cron jobs).\\\
      n    \\\"\\\"\\\"\\n    ids = list_service_ids()\\n    if not ids:\\n      \
      \  return None\\n    return ids[0] if fallback_to_first else None\\n\\n\\ndef\
      \ config_to_source(cfg: dict) -\\u003e dict:\\n    \\\"\\\"\\\"Convert a service\
      \ config dict to the db.py 'source' dict format.\\\"\\\"\\\"\\n    if is_high_throughput_mode()\
      \ and cfg.get(\\\"raw_layout_version\\\") != 3:\\n        raise RuntimeError(\\\
      n            f\\\"service {cfg.get('service_id', '\\u003cunknown\\u003e')} uses\
      \ the v2 raw-log layout; \\\"\\n            \\\"tear it down and reprovision\
      \ it for v3 before enabling high-throughput deployment\\\"\\n        )\\n  \
      \  actual_db_path = duckdb_path(cfg.get(\\\"service_id\\\", \\\"default\\\"\
      ))\\n\\n    region = cfg.get(\\\"fos_region\\\", \\\"us-east-1\\\")\\n\\n  \
      \  # Native FOS endpoint \u2014 used by boto3 for ListObjectsV2/PutObject/DeleteObject\\\
      n    # etc. The CDN VCL only proxies GET/HEAD on object keys, not bucket-listing\\\
      n    # requests, so writes and lists must go direct.\\n    native_endpoint =\
      \ cfg.get(\\\"fos_endpoint\\\", f\\\"{region}.object.fastlystorage.app\\\")\\\
      n\\n    # Prefer CDN URL as the S3 endpoint for DuckDB httpfs reads (parquet\
      \ GETs)\\n    # so we benefit from caching and free egress.\\n    cdn_url =\
      \ cfg.get(\\\"cdn_url\\\")\\n    if cdn_url:\\n        endpoint = cdn_url.replace(\\\
      \"https://\\\", \\\"\\\").replace(\\\"http://\\\", \\\"\\\").split(\\\"/\\\"\
      )[0]\\n    else:\\n        endpoint = native_endpoint\\n\\n    prov = cfg.get(\\\
      \"provisioning\\\", {})\\n\\n    log_fields = cfg.get(\\\"log_fields\\\") or\
      \ {}\\n    if log_fields and \\\"format_hash\\\" not in log_fields:\\n     \
      \   try:\\n            from backend.core import log_fields as lf_module\\n\\\
      n            log_fields = dict(log_fields)\\n            log_fields[\\\"format_hash\\\
      \"] = lf_module.format_hash(log_fields)\\n        except Exception:\\n     \
      \       pass\\n\\n    return {\\n        \\\"name\\\": cfg.get(\\\"service_id\\\
      \", \\\"default\\\"),\\n        \\\"service_id\\\": cfg.get(\\\"service_id\\\
      \", \\\"default\\\"),\\n        \\\"service_name\\\": cfg.get(\\\"name\\\",\
      \ \\\"\\\"),\\n        \\\"endpoint\\\": endpoint,\\n        \\\"fos_native_endpoint\\\
      \": native_endpoint,\\n        \\\"access_key_id\\\": cfg.get(\\\"fos_access_key_id\\\
      \", \\\"\\\"),\\n        \\\"secret_access_key\\\": cfg.get(\\\"fos_secret_access_key\\\
      \", \\\"\\\"),\\n        \\\"bucket\\\": cfg.get(\\\"fos_bucket\\\", \\\"\\\"\
      ),\\n        \\\"prefix\\\": \\\"\\\",\\n        \\\"region\\\": region,\\n\
      \        \\\"cdn_url\\\": cfg.get(\\\"cdn_url\\\", \\\"\\\"),\\n        \\\"\
      cdn_secret\\\": cfg.get(\\\"cdn_secret\\\", \\\"\\\"),\\n        \\\"cdn_service_id\\\
      \": cfg.get(\\\"cdn_service_id\\\", \\\"\\\"),\\n        \\\"logging_service_id\\\
      \": cfg.get(\\\"service_id\\\", \\\"\\\"),\\n        \\\"duckdb_path\\\": actual_db_path,\\\
      n        \\\"deployment_mode\\\": DEPLOYMENT_MODE,\\n        \\\"access_level\\\
      \": cfg.get(\\\"access_level\\\", \\\"read_write\\\"),\\n        \\\"storage_mode\\\
      \": cfg.get(\\\"storage_mode\\\", \\\"cloud\\\"),\\n        \\\"log_period\\\
      \": int(cfg.get(\\\"log_period\\\", 60)),\\n        \\\"log_fields\\\": log_fields,\\\
      n        \\\"provisioning\\\": prov,\\n        \\\"rum_enabled\\\": cfg.get(\\\
      \"rum_enabled\\\", False) or (cfg.get(\\\"rum\\\") or {}).get(\\\"enabled\\\"\
      , False),\\n        \\\"rum\\\": cfg.get(\\\"rum\\\", {}),\\n    }\\n\\n\\ndef\
      \ fetch_service_name(service_id: str, api_key: str) -\\u003e str | None:\\n\
      \    \\\"\\\"\\\"Fetch the human-readable service name from the Fastly API.\\\
      n\\n    Routes through the shared ``fastly()`` client with ``timeout=10`` +\\\
      n    ``max_retries=1`` so the worst-case cold-path tail stays bounded\\n   \
      \ (~21 s vs the client default of ~127 s). The caller is behind a\\n    300\
      \ s name cache (see :func:`refresh_service_name`) so steady-state\\n    cost\
      \ is one call per service per 5 min.\\n\\n    Returns None on failure (caller\
      \ should use the cached name).\\n    \\\"\\\"\\\"\\n    from backend.core.fastly.client\
      \ import fastly\\n\\n    try:\\n        data = fastly(\\\"GET\\\", f\\\"/service/{service_id}\\\
      \", token=api_key, timeout=10, max_retries=1)\\n        return data.get(\\\"\
      name\\\")\\n    except Exception:\\n        return None\\n\\n\\ndef refresh_service_name(service_id:\
      \ str, api_key: str | None = None) -\\u003e str:\\n    \\\"\\\"\\\"Return service\
      \ name, using cache. Refreshes from API if cache is stale.\\n\\n    Falls back\
      \ to name in config, then to service_id itself.\\n    \\\"\\\"\\\"\\n    now\
      \ = time.time()\\n    with _name_cache_lock:\\n        entry = _name_cache.get(service_id)\\\
      n        if entry and (now - entry[\\\"fetched_at\\\"]) \\u003c _NAME_CACHE_TTL:\\\
      n            return entry[\\\"name\\\"]\\n\\n    # Try to fetch from API\\n\
      \    api_name = None\\n    if api_key and api_key.strip():\\n        api_name\
      \ = fetch_service_name(service_id, api_key)\\n        if api_name:\\n      \
      \      with _name_cache_lock:\\n                _name_cache[service_id] = {\\\
      \"name\\\": api_name, \\\"fetched_at\\\": now}\\n\\n            # Persist to\
      \ config if it has changed or was the ID\\n            cfg = load_config(service_id)\\\
      n            if cfg and (cfg.get(\\\"name\\\") != api_name or cfg.get(\\\"name\\\
      \") == service_id):\\n                cfg[\\\"name\\\"] = api_name\\n      \
      \          save_config(service_id, cfg)\\n            return api_name\\n\\n\
      \    # Fall back to config\\n    cfg = load_config(service_id)\\n    if cfg:\\\
      n        name = cfg.get(\\\"name\\\") or service_id\\n        with _name_cache_lock:\\\
      n            # On failure, don't try again for 2 minutes\\n            _name_cache[service_id]\
      \ = {\\\"name\\\": name, \\\"fetched_at\\\": now - _NAME_CACHE_TTL + 120}\\\
      n        return name\\n\\n    return service_id\\n\\n\\ndef _refresh_service_names_bg(misses_args:\
      \ list[tuple[str, str | None]]) -\\u003e None:\\n    try:\\n        for sid,\
      \ api_key in misses_args:\\n            try:\\n                refresh_service_name(sid,\
      \ api_key)\\n            except Exception:\\n                pass\\n    finally:\\\
      n        with _name_refresh_lock:\\n            for sid, _ in misses_args:\\\
      n                _name_refresh_in_flight.discard(sid)\\n\\n\\ndef refresh_all_service_names(configs:\
      \ list[dict], _sync: bool = False) -\\u003e dict[str, str]:\\n    \\\"\\\"\\\
      \"Refresh service names for all configs. Returns {service_id: name}.\\n\\n \
      \   Stale-while-revalidate asynchronous refresh by default to completely avoid\\\
      n    blocking web requests or spawning a ThreadPoolExecutor on the request thread.\\\
      n    Returns the best available name (cached or from JSON config) immediately\\\
      n    and spins off a background thread to update the cache in the background.\\\
      n\\n    For testing/synchronous usage, specify _sync=True.\\n    \\\"\\\"\\\"\
      \\n    now = time.time()\\n    name_map: dict[str, str] = {}\\n    misses: list[dict]\
      \ = []\\n    with _name_cache_lock:\\n        for cfg in configs:\\n       \
      \     sid = cfg.get(\\\"service_id\\\", \\\"\\\")\\n            entry = _name_cache.get(sid)\\\
      n            if entry and (now - entry[\\\"fetched_at\\\"]) \\u003c _NAME_CACHE_TTL:\\\
      n                name_map[sid] = entry[\\\"name\\\"]\\n            else:\\n\
      \                misses.append(cfg)\\n\\n    if not misses:\\n        return\
      \ name_map\\n\\n    if _sync:\\n        import concurrent.futures\\n\\n    \
      \    with concurrent.futures.ThreadPoolExecutor(max_workers=5) as executor:\\\
      n            futures = {\\n                executor.submit(refresh_service_name,\
      \ cfg.get(\\\"service_id\\\", \\\"\\\"), cfg.get(\\\"fastly_api_key\\\", \\\"\
      \\\")): cfg\\n                for cfg in misses\\n            }\\n         \
      \   for future in concurrent.futures.as_completed(futures):\\n             \
      \   cfg = futures[future]\\n                sid = cfg.get(\\\"service_id\\\"\
      , \\\"\\\")\\n                try:\\n                    name_map[sid] = future.result()\\\
      n                except Exception:\\n                    name_map[sid] = cfg.get(\\\
      \"name\\\") or sid\\n        return name_map\\n\\n    # Asynchronous stale-while-revalidate\
      \ path\\n    to_schedule = []\\n    with _name_refresh_lock:\\n        for cfg\
      \ in misses:\\n            sid = cfg.get(\\\"service_id\\\", \\\"\\\")\\n  \
      \          entry = _name_cache.get(sid)\\n            best_effort = sid\\n \
      \           if entry:\\n                best_effort = entry[\\\"name\\\"]\\\
      n            elif cfg.get(\\\"name\\\"):\\n                best_effort = cfg[\\\
      \"name\\\"]\\n            name_map[sid] = best_effort\\n\\n            if sid\
      \ not in _name_refresh_in_flight:\\n                _name_refresh_in_flight.add(sid)\\\
      n                to_schedule.append((sid, cfg.get(\\\"fastly_api_key\\\")))\\\
      n\\n    if to_schedule:\\n        try:\\n            threading.Thread(\\n  \
      \              target=_refresh_service_names_bg,\\n                args=(to_schedule,),\\\
      n                name=\\\"refresh-service-names-bg\\\",\\n                daemon=True,\\\
      n            ).start()\\n        except Exception:\\n            with _name_refresh_lock:\\\
      n                for sid, _ in to_schedule:\\n                    _name_refresh_in_flight.discard(sid)\\\
      n\\n    return name_map\\n\\n\\n# \u2500\u2500 Fastly credential helpers \u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\\n\\n\\ndef _get_cfg_field(field:\
      \ str, service_id: str | None, default):\\n    \\\"\\\"\\\"Return ``cfg[field]``\
      \ for ``service_id`` (or the active service), or\\n    ``default`` when nothing\
      \ is configured.\\n\\n    Shared by the four near-identical fastly + ngwaf accessors\
      \ below. All\\n    four used to paste the same ``sid = service_id or get_active_service_id();\\\
      n    if sid: cfg = load_config(sid); if cfg: return cfg.get(field, ...)``\\\
      n    block. Pulling the dispatch up means adding another accessor is a\\n  \
