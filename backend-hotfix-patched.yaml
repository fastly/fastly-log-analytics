apiVersion: v1
data:
  config.py: "\"\"\"Service configuration management for multi-service support.\n\n\
    Each service is stored as a JSON file in the configs/ directory.\nThe filename\
    \ is the Fastly logging service ID (e.g. abcdefg12345abcdef1234.json).\n\nConfig\
    \ file schema:\n{\n    \"service_id\": \"abcdefg12345abcdef1234\",   # Fastly\
    \ logging service ID (matches filename)\n    \"name\": \"My Production Site\"\
    ,               # Human-readable label (from Fastly API)\n    \"access_level\"\
    : \"read_write\",               # \"read_write\" or \"read_only\"\n    \"fos_endpoint\"\
    : \"us-east-1.object.fastlystorage.app\",\n    \"fos_access_key_id\": \"...\"\
    ,\n    \"fos_secret_access_key\": \"...\",\n    \"fos_bucket\": \"...\",\n   \
    \ \"fos_prefix\": \"\",\n    \"raw_layout_version\": 3,\n    \"fos_region\": \"\
    us-east-1\",\n    \"cdn_url\": \"https://...\",\n    \"cdn_secret\": \"...\",\n\
    \    \"cdn_service_id\": \"...\",                    # The CDN VCL service fronting\
    \ FOS\n    \"fastly_api_key\": \"...\",                    # Account-wide Fastly\
    \ API key\n    \"provisioning\": {                           # Embedded provisioning\
    \ state for teardown\n        \"endpoint_name\": \"Fastly Object Storage Logs\"\
    ,\n        \"temp_admin_key_id\": null\n    }\n}\n\"\"\"\n\nimport copy\nimport\
    \ json\nimport logging\nimport math\nimport os\nimport re\nimport sys\nimport\
    \ tempfile\nimport threading\nimport time\nfrom dataclasses import dataclass,\
    \ field\nfrom ipaddress import ip_address\nfrom pathlib import Path\n\nlogger\
    \ = logging.getLogger(__name__)\n\n_ROOT_DIR = Path(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\n\
    \nCONFIGS_DIR = _ROOT_DIR / \"configs\"\nDATA_DIR = _ROOT_DIR / \"data\"\n\n#\
    \ Sub-directories for organized data storage\nSERVICES_DATA_DIR = DATA_DIR / \"\
    services\"\nNGWAF_DATA_DIR = DATA_DIR / \"ngwaf\"\nCACHE_DATA_DIR = DATA_DIR /\
    \ \"cache\"\nSYSTEM_DATA_DIR = DATA_DIR / \"system\"\n\n# Deployment topology\
    \ is deployment-wide rather than per-service. Define this\n# before the default\
    \ source is built so config_to_source() can safely include\n# it during module\
    \ import.\nDEPLOYMENT_MODE = os.getenv(\"DEPLOYMENT_MODE\", \"standard\").strip().lower()\n\
    \n\n@dataclass(frozen=True)\nclass ClickHouseConfig:\n    \"\"\"Deployment-only\
    \ HTTP settings; loaded at startup, never from service JSON.\"\"\"\n\n    host:\
    \ str\n    port: int\n    database: str\n    user: str\n    password: str = field(repr=False)\n\
    \    secure: bool = True\n    connect_timeout_s: float = 5.0\n    query_timeout_s:\
    \ float = 30.0\n    insert_timeout_s: float = 30.0\n    pool_timeout_s: float\
    \ = 5.0\n    pool_max_size: int = 8\n\n\ndef _clickhouse_bool(name: str, default:\
    \ str) -> bool:\n    raw = os.getenv(name, default).strip().lower()\n    if raw\
    \ in {\"1\", \"true\", \"yes\", \"on\"}:\n        return True\n    if raw in {\"\
    0\", \"false\", \"no\", \"off\"}:\n        return False\n    raise ValueError(f\"\
    {name} must be a boolean\")\n\n\ndef _clickhouse_number(name: str, default: float,\
    \ maximum: float, *, integer: bool = False):\n    try:\n        raw = os.getenv(name,\
    \ str(default))\n        value = int(raw) if integer else float(raw)\n       \
    \ if math.isfinite(value) and (1 if integer else 0.01) <= value <= maximum:\n\
    \            return value\n    except (ValueError, OverflowError):\n        pass\n\
    \    raise ValueError(f\"{name} must be finite and between {1 if integer else\
    \ 0.01} and {maximum}\")\n\n\ndef load_clickhouse_config() -> ClickHouseConfig\
    \ | None:\n    \"\"\"CLICKHOUSE_ENABLED is opt-in; disabled mode ignores all other\
    \ settings.\n\n    Enabled mode requires HOST (bare DNS/IP), DATABASE and USER.\
    \ SECURE defaults\n    to true (verified HTTPS, port 8443; HTTP uses 8123). A\
    \ missing PASSWORD is\n    permitted only for explicitly insecure loopback test\
    \ instances. Operators\n    must opt into SECURE=false for a trusted private-network\
    \ HTTP deployment.\n    CONNECT/POOL_TIMEOUT_S are 0.01..60; QUERY/INSERT_TIMEOUT_S\
    \ 0.01..300;\n    POOL_MAX_SIZE is 1..64. Environment changes require a process\
    \ restart.\n    \"\"\"\n    if not _clickhouse_bool(\"CLICKHOUSE_ENABLED\", \"\
    false\"):\n        return None\n    required = {}\n    for key in (\"HOST\", \"\
    DATABASE\", \"USER\"):\n        value = os.getenv(f\"CLICKHOUSE_{key}\", \"\"\
    ).strip()\n        if not value:\n            raise ValueError(f\"CLICKHOUSE_{key}\
    \ is required when enabled\")\n        required[key] = value\n    host = required[\"\
    HOST\"]\n    loopback = host == \"localhost\"\n    try:\n        loopback = ip_address(host).is_loopback\n\
    \    except ValueError:\n        if len(host) > 253 or not all(\n            re.fullmatch(r\"\
    [A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\", label) for label in host.split(\"\
    .\")\n        ):\n            raise ValueError(\"CLICKHOUSE_HOST must be a bare\
    \ hostname or IP address\") from None\n    if not re.fullmatch(r\"[A-Za-z_][A-Za-z0-9_]{0,127}\"\
    , required[\"DATABASE\"]):\n        raise ValueError(\"CLICKHOUSE_DATABASE must\
    \ be a simple identifier\")\n    if not re.fullmatch(r\"[A-Za-z0-9_.@-]{1,128}\"\
    , required[\"USER\"]):\n        raise ValueError(\"CLICKHOUSE_USER contains unsupported\
    \ characters\")\n    secure = _clickhouse_bool(\"CLICKHOUSE_SECURE\", \"true\"\
    )\n    password = os.getenv(\"CLICKHOUSE_PASSWORD\", \"\")\n    if not password.strip()\
    \ and (secure or not loopback):\n        raise ValueError(\"CLICKHOUSE_PASSWORD\
    \ is required except for explicit HTTP loopback tests\")\n    query_timeout =\
    \ _clickhouse_number(\"CLICKHOUSE_QUERY_TIMEOUT_S\", 30, 300)\n    return ClickHouseConfig(\n\
    \        host=host,\n        port=_clickhouse_number(\"CLICKHOUSE_PORT\", 8443\
    \ if secure else 8123, 65535, integer=True),\n        database=required[\"DATABASE\"\
    ],\n        user=required[\"USER\"],\n        password=password,\n        secure=secure,\n\
    \        connect_timeout_s=_clickhouse_number(\"CLICKHOUSE_CONNECT_TIMEOUT_S\"\
    , 5, 60),\n        query_timeout_s=query_timeout,\n        insert_timeout_s=_clickhouse_number(\"\
    CLICKHOUSE_INSERT_TIMEOUT_S\", query_timeout, 300),\n        pool_timeout_s=_clickhouse_number(\"\
    CLICKHOUSE_POOL_TIMEOUT_S\", 5, 60),\n        pool_max_size=_clickhouse_number(\"\
    CLICKHOUSE_POOL_MAX_SIZE\", 8, 64, integer=True),\n    )\n\n\n# Cache for Fastly\
    \ service names: {service_id: {\"name\": str, \"fetched_at\": float}}\n_name_cache:\
    \ dict = {}\n_name_cache_lock = threading.Lock()\n_name_refresh_in_flight: set[str]\
    \ = set()\n_name_refresh_lock = threading.Lock()\n_NAME_CACHE_TTL = 300  # 5 minutes\n\
    \n# Cache for parsed configs: {service_id: (mtime_ns, parsed_dict)}.\n# Revalidated\
    \ by stat() on each load_config call AND explicitly invalidated\n# by save_config\
    \ \u2014 mtime alone is not enough because Linux ext4/tmpfs can\n# produce identical\
    \ st_mtime_ns for two writes within the same microsecond.\n# Hot paths (sync-status\
    \ polls, every cron tick, every dashboard request)\n# hit this enough that skipping\
    \ the open+read on the no-change path adds up.\n_config_cache: dict[str, tuple[int,\
    \ dict]] = {}\n_config_cache_lock = threading.Lock()\n\n# Path-keyed memo for\
    \ _ensure_dirs(). Called from every list_configs /\n# save_config / save_usage_logging_config\
    \ so the mkdir(exist_ok=True)\n# syscall storm shows up under load. Tests that\
    \ monkeypatch CONFIGS_DIR\n# get fresh entries because the tmp_path is a different\
    \ Path object.\n_ensured_dirs: set[Path] = set()\n\n\ndef _ensure_dirs():\n  \
    \  dirs = (CONFIGS_DIR, DATA_DIR, SERVICES_DATA_DIR, NGWAF_DATA_DIR, CACHE_DATA_DIR,\
    \ SYSTEM_DATA_DIR)\n    missing = [d for d in dirs if d not in _ensured_dirs]\n\
    \    if not missing:\n        return\n    for d in missing:\n        d.mkdir(exist_ok=True)\n\
    \        _ensured_dirs.add(d)\n\n\n# Alphabet shared with backend.deps.ServiceId.\
    \ Public so the FastAPI\n# Path validator can reuse the same pattern instead of\
    \ redefining it.\nSERVICE_ID_PATTERN = r\"^[A-Za-z0-9_-]+$\"\n_SERVICE_ID_RE =\
    \ re.compile(SERVICE_ID_PATTERN)\n_SERVICE_ID_MAX_LEN = 64\n\n\ndef _validate_service_id(service_id:\
    \ str) -> str:\n    \"\"\"Security: defense in depth against path traversal in\
    \ any helper\n    that builds a path from ``service_id``.\n\n    Real Fastly service\
    \ IDs are opaque 22-char alphanumeric strings, but the\n    test suite and a handful\
    \ of legacy provisioning paths use hyphenated\n    IDs like ``svc-1`` / ``test-service-id``.\
    \ The regex therefore accepts\n    ``[A-Za-z0-9_-]+`` \u2014 every character allowed\
    \ is safe inside a filename\n    and contains no path-separator / dot / null-byte.\
    \ Without this,\n    ``service_id=\"/etc/passwd\"`` or ``service_id=\"../../tmp/x\"\
    `` would\n    compose with ``pathlib`` semantics \u2014 absolute paths discard\
    \ the base\n    entirely, relative ``..`` traverses out, and ``\\\\x00`` truncates\
    \ on\n    some kernels.\n\n    Length cap (64) is well above the longest legitimate\
    \ Fastly ID (22)\n    and bounds memory in error-logging paths.\n    \"\"\"\n\
    \    if not isinstance(service_id, str):\n        raise ValueError(f\"invalid\
    \ service_id type {type(service_id).__name__}: must be str (security)\")\n   \
    \ if not service_id or len(service_id) > _SERVICE_ID_MAX_LEN:\n        raise ValueError(\n\
    \            f\"invalid service_id length {len(service_id) if service_id else\
    \ 0}: \"\n            f\"1..{_SERVICE_ID_MAX_LEN} characters required (security)\"\
    \n        )\n    if not _SERVICE_ID_RE.match(service_id):\n        raise ValueError(f\"\
    invalid service_id {service_id!r}: must be alphanumeric / dash / underscore (security)\"\
    )\n    return service_id\n\n\ndef config_path(service_id: str) -> Path:\n    _validate_service_id(service_id)\n\
    \    return CONFIGS_DIR / f\"{service_id}.json\"\n\n\ndef duckdb_path(service_id:\
    \ str) -> str:\n    _validate_service_id(service_id)\n    return str(SERVICES_DATA_DIR\
    \ / f\"{service_id}.duckdb\")\n\n\ndef load_config(service_id: str | None) ->\
    \ dict | None:\n    \"\"\"Load a single service config by ID. Returns None if\
    \ not found.\n\n    Returns a freshly-parsed dict on every call \u2014 callers\
    \ that mutate the\n    result (e.g. update_status) won't poison the cache. The\
    \ on-disk file is\n    revalidated via st_mtime_ns, so external edits and save_config\
    \ writes\n    are picked up on the next call without explicit invalidation.\n\n\
    \    Returns ``None`` (not a raised exception) for invalid service IDs,\n    including\
    \ ``None`` itself \u2014 several call sites in the iceberg/\n    submodules pass\
    \ ``src.get(\"name\")`` (typed as ``Any | None``) and\n    rely on the None response\
    \ to mean \"no config\". Security's validation\n    in ``config_path`` is still\
    \ what blocks path-traversal; this just\n    makes the helper friendlier at call\
    \ sites that don't pre-validate.\n    \"\"\"\n    if service_id is None:\n   \
    \     return None\n    try:\n        path = config_path(service_id)\n    except\
    \ ValueError:\n        return None\n    try:\n        mtime_ns = path.stat().st_mtime_ns\n\
    \    except FileNotFoundError:\n        return None\n\n    cached = _config_cache.get(service_id)\n\
    \    if cached is not None and cached[0] == mtime_ns:\n        return copy.deepcopy(cached[1])\n\
    \n    with open(path, \"rb\") as f:\n        raw = f.read()\n    parsed = json.loads(raw)\n\
    \    with _config_cache_lock:\n        _config_cache[service_id] = (mtime_ns,\
    \ parsed)\n    return copy.deepcopy(parsed)\n\n\ndef _atomic_write_json(path,\
    \ data: dict) -> None:\n    \"\"\"Write ``data`` to ``path`` atomically (unique\
    \ tmp file + os.replace).\n\n    Shared by :func:`save_config` and :func:`save_usage_logging_config`,\n\
    \    which used to paste identical mkstemp / fdopen / json.dump / os.replace\n\
    \    blocks. Uses a UNIQUE tmp file (per-call random suffix) so concurrent\n \
    \   callers cannot clobber each other's tmp file mid-write. The shared-tmp\n \
    \   variant produced corrupted JSON (a stray ``}`` appended to the rendered\n\
    \    file) and bricked the backend on next read; we hit it twice in one\n    debugging\
    \ session before fixing.\n    \"\"\"\n    fd, tmp_path = tempfile.mkstemp(prefix=f\"\
    .{path.name}.\", suffix=\".tmp\", dir=str(path.parent))\n    try:\n        with\
    \ os.fdopen(fd, \"w\") as f:\n            json.dump(data, f, indent=2)\n     \
    \   os.replace(tmp_path, path)\n    except Exception:\n        try:\n        \
    \    os.unlink(tmp_path)\n        except OSError:\n            pass\n        raise\n\
    \n\ndef save_config(service_id: str, cfg: dict):\n    \"\"\"Write a service config\
    \ atomically. See :func:`_atomic_write_json`.\"\"\"\n    global _cdn_service_id_map\n\
    \    _ensure_dirs()\n    if \"created_at\" not in cfg or not cfg[\"created_at\"\
    ]:\n        import datetime as _dt\n\n        cfg[\"created_at\"] = _dt.datetime.now(_dt.UTC).isoformat()\n\
    \    try:\n        _atomic_write_json(config_path(service_id), cfg)\n    except\
    \ (OSError, PermissionError) as e:\n        if getattr(e, \"errno\", None) ==\
    \ 30 or \"read-only\" in str(e).lower():\n            logger.warning(\"save_config_skipped_read_only_fs\
    \ service_id=%s: %s\", service_id, e)\n            return\n        raise\n   \
    \ # Invalidate the load_config cache. The cache uses st_mtime_ns as its\n    #\
    \ revalidation key, which is normally fine \u2014 but on Linux ext4/tmpfs two\n\
    \    # os.replace() calls within the same microsecond can produce identical\n\
    \    # mtime_ns values, so a cached (old_mtime, old_raw) entry can stay\n    #\
    \ \"fresh\" after this write and serve stale bytes. update_status() does\n   \
    \ # exactly that: load \u2192 mutate \u2192 save \u2192 and the next load can\
    \ see the\n    # pre-mutation cached copy. Drop the entry so the next load re-reads.\n\
    \    with _config_cache_lock:\n        _config_cache.pop(service_id, None)\n \
    \   _cdn_service_id_map = None\n\n\ndef update_status(service_id: str, status:\
    \ dict):\n    \"\"\"Partially update the 'status' section of a service config.\"\
    \"\"\n    cfg = load_config(service_id)\n    if not cfg:\n        return\n\n \
    \   current_status = cfg.get(\"status\", {})\n    current_status.update(status)\n\
    \    current_status[\"updated_at\"] = time.time()\n    cfg[\"status\"] = current_status\n\
    \    save_config(service_id, cfg)\n\n\ndef get_status(service_id: str) -> dict:\n\
    \    \"\"\"Return the 'status' section of a service config.\"\"\"\n    cfg = load_config(service_id)\n\
    \    if not cfg:\n        return {}\n    return cfg.get(\"status\", {})\n\n\n\
    def delete_config(service_id: str):\n    \"\"\"Remove a service config file.\"\
    \"\"\n    global _cdn_service_id_map\n    path = config_path(service_id)\n   \
    \ if path.exists():\n        path.unlink()\n    _cdn_service_id_map = None\n \
    \   with _config_cache_lock:\n        _config_cache.pop(service_id, None)\n\n\n\
    _cdn_service_id_map: dict[str, str] | None = None\n\n\ndef get_cdn_service_id_map()\
    \ -> dict[str, str]:\n    \"\"\"Return a mapping of CDN service IDs to their logging\
    \ service IDs. Memoized.\"\"\"\n    global _cdn_service_id_map\n    if _cdn_service_id_map\
    \ is not None:\n        return _cdn_service_id_map\n\n    m = {}\n    for c in\
    \ list_configs():\n        cdn_sid = c.get(\"cdn_service_id\")\n        if cdn_sid:\n\
    \            m[cdn_sid] = c[\"service_id\"]\n    _cdn_service_id_map = m\n   \
    \ return m\n\n\ndef list_service_ids() -> list[str]:\n    \"\"\"Return all configured\
    \ service IDs (sorted).\"\"\"\n    _ensure_dirs()\n    return sorted(p.stem for\
    \ p in CONFIGS_DIR.glob(\"*.json\"))\n\n\ndef list_configs() -> list[dict]:\n\
    \    \"\"\"Return all service configs as a list, sorted by service ID.\"\"\"\n\
    \    return [c for sid in list_service_ids() if (c := load_config(sid)) is not\
    \ None]\n\n\ndef get_active_service_id(fallback_to_first: bool = True) -> str\
    \ | None:\n    \"\"\"Return the first configured service ID as a fallback default.\n\
    \n    The actual active service is tracked client-side in localStorage and\n \
    \   passed via the ?service= query param. This is used server-side when\n    no\
    \ service is specified (e.g. health checks, cron jobs).\n    \"\"\"\n    ids =\
    \ list_service_ids()\n    if not ids:\n        return None\n    return ids[0]\
    \ if fallback_to_first else None\n\n\ndef config_to_source(cfg: dict) -> dict:\n\
    \    \"\"\"Convert a service config dict to the db.py 'source' dict format.\"\"\
    \"\n    if is_high_throughput_mode() and cfg.get(\"raw_layout_version\") != 3:\n\
    \        raise RuntimeError(\n            f\"service {cfg.get('service_id', '<unknown>')}\
    \ uses the v2 raw-log layout; \"\n            \"tear it down and reprovision it\
    \ for v3 before enabling high-throughput deployment\"\n        )\n    actual_db_path\
    \ = duckdb_path(cfg.get(\"service_id\", \"default\"))\n\n    region = cfg.get(\"\
    fos_region\", \"us-east-1\")\n\n    # Native FOS endpoint \u2014 used by boto3\
    \ for ListObjectsV2/PutObject/DeleteObject\n    # etc. The CDN VCL only proxies\
    \ GET/HEAD on object keys, not bucket-listing\n    # requests, so writes and lists\
    \ must go direct.\n    native_endpoint = cfg.get(\"fos_endpoint\", f\"{region}.object.fastlystorage.app\"\
    )\n\n    # Prefer CDN URL as the S3 endpoint for DuckDB httpfs reads (parquet\
    \ GETs)\n    # so we benefit from caching and free egress.\n    cdn_url = cfg.get(\"\
    cdn_url\")\n    if cdn_url:\n        endpoint = cdn_url.replace(\"https://\",\
    \ \"\").replace(\"http://\", \"\").split(\"/\")[0]\n    else:\n        endpoint\
    \ = native_endpoint\n\n    prov = cfg.get(\"provisioning\", {})\n\n    log_fields\
    \ = cfg.get(\"log_fields\") or {}\n    if log_fields and \"format_hash\" not in\
    \ log_fields:\n        try:\n            from backend.core import log_fields as\
    \ lf_module\n\n            log_fields = dict(log_fields)\n            log_fields[\"\
    format_hash\"] = lf_module.format_hash(log_fields)\n        except Exception:\n\
    \            pass\n\n    return {\n        \"name\": cfg.get(\"service_id\", \"\
    default\"),\n        \"service_id\": cfg.get(\"service_id\", \"default\"),\n \
    \       \"service_name\": cfg.get(\"name\", \"\"),\n        \"endpoint\": endpoint,\n\
    \        \"fos_native_endpoint\": native_endpoint,\n        \"access_key_id\"\
    : cfg.get(\"fos_access_key_id\", \"\"),\n        \"secret_access_key\": cfg.get(\"\
    fos_secret_access_key\", \"\"),\n        \"bucket\": cfg.get(\"fos_bucket\", \"\
    \"),\n        \"prefix\": \"\",\n        \"region\": region,\n        \"cdn_url\"\
    : cfg.get(\"cdn_url\", \"\"),\n        \"cdn_secret\": cfg.get(\"cdn_secret\"\
    , \"\"),\n        \"cdn_service_id\": cfg.get(\"cdn_service_id\", \"\"),\n   \
    \     \"logging_service_id\": cfg.get(\"service_id\", \"\"),\n        \"duckdb_path\"\
    : actual_db_path,\n        \"deployment_mode\": DEPLOYMENT_MODE,\n        \"access_level\"\
    : cfg.get(\"access_level\", \"read_write\"),\n        \"storage_mode\": cfg.get(\"\
    storage_mode\", \"cloud\"),\n        \"log_period\": int(cfg.get(\"log_period\"\
    , 60)),\n        \"log_fields\": log_fields,\n        \"provisioning\": prov,\n\
    \        \"rum_enabled\": cfg.get(\"rum_enabled\", False) or (cfg.get(\"rum\"\
    ) or {}).get(\"enabled\", False),\n        \"rum\": cfg.get(\"rum\", {}),\n  \
    \  }\n\n\ndef fetch_service_name(service_id: str, api_key: str) -> str | None:\n\
    \    \"\"\"Fetch the human-readable service name from the Fastly API.\n\n    Routes\
    \ through the shared ``fastly()`` client with ``timeout=10`` +\n    ``max_retries=1``\
    \ so the worst-case cold-path tail stays bounded\n    (~21 s vs the client default\
    \ of ~127 s). The caller is behind a\n    300 s name cache (see :func:`refresh_service_name`)\
    \ so steady-state\n    cost is one call per service per 5 min.\n\n    Returns\
    \ None on failure (caller should use the cached name).\n    \"\"\"\n    from backend.core.fastly.client\
    \ import fastly\n\n    try:\n        data = fastly(\"GET\", f\"/service/{service_id}\"\
    , token=api_key, timeout=10, max_retries=1)\n        return data.get(\"name\"\
    )\n    except Exception:\n        return None\n\n\ndef refresh_service_name(service_id:\
    \ str, api_key: str | None = None) -> str:\n    \"\"\"Return service name, using\
    \ cache. Refreshes from API if cache is stale.\n\n    Falls back to name in config,\
    \ then to service_id itself.\n    \"\"\"\n    now = time.time()\n    with _name_cache_lock:\n\
    \        entry = _name_cache.get(service_id)\n        if entry and (now - entry[\"\
    fetched_at\"]) < _NAME_CACHE_TTL:\n            return entry[\"name\"]\n\n    #\
    \ Try to fetch from API\n    api_name = None\n    if api_key and api_key.strip():\n\
    \        api_name = fetch_service_name(service_id, api_key)\n        if api_name:\n\
    \            with _name_cache_lock:\n                _name_cache[service_id] =\
    \ {\"name\": api_name, \"fetched_at\": now}\n\n            # Persist to config\
    \ if it has changed or was the ID\n            cfg = load_config(service_id)\n\
    \            if cfg and (cfg.get(\"name\") != api_name or cfg.get(\"name\") ==\
    \ service_id):\n                cfg[\"name\"] = api_name\n                save_config(service_id,\
    \ cfg)\n            return api_name\n\n    # Fall back to config\n    cfg = load_config(service_id)\n\
    \    if cfg:\n        name = cfg.get(\"name\") or service_id\n        with _name_cache_lock:\n\
    \            # On failure, don't try again for 2 minutes\n            _name_cache[service_id]\
    \ = {\"name\": name, \"fetched_at\": now - _NAME_CACHE_TTL + 120}\n        return\
    \ name\n\n    return service_id\n\n\ndef _refresh_service_names_bg(misses_args:\
    \ list[tuple[str, str | None]]) -> None:\n    try:\n        for sid, api_key in\
    \ misses_args:\n            try:\n                refresh_service_name(sid, api_key)\n\
    \            except Exception:\n                pass\n    finally:\n        with\
    \ _name_refresh_lock:\n            for sid, _ in misses_args:\n              \
    \  _name_refresh_in_flight.discard(sid)\n\n\ndef refresh_all_service_names(configs:\
    \ list[dict], _sync: bool = False) -> dict[str, str]:\n    \"\"\"Refresh service\
