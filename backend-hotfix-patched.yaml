    \n    if start is not None and end is not None:\n        clauses.append(\"event_timestamp\
    \ >= {start:DateTime64(3)}\")\n        clauses.append(\"event_timestamp < {end:DateTime64(3)}\"\
    )\n        params.update({\"start\": start, \"end\": end})\n\n    where_clause\
    \ = \" AND \".join(clauses)\n    import logging\n\n    logging.getLogger(__name__).warning(\"\
    DEBUG EXACT QUERY: %s params: %s\", where_clause, params)\n\n    requested_fields\
    \ = req.fields or list(_FIELD_DIMENSIONS)\n\n    def fetch_field(field: str):\n\
    \        if field not in _FIELD_DIMENSIONS:\n            return field, []\n  \
    \      col_name = _FIELD_DIMENSIONS[field]\n\n        if col_name in {\"client_ip\"\
    , \"country\", \"url\", \"cmcd\", \"custom_fields\"}:\n            sql_col = col_name\n\
    \        elif col_name in {\"age\", \"ttl\"}:\n            sql_col = f\"CAST(CAST(ROUND(toFloat64OrZero(custom_fields['{col_name}']))\
    \ AS INTEGER) AS VARCHAR)\"\n        else:\n            sql_col = f\"custom_fields['{col_name}']\"\
    \n\n        q = f\"SELECT {sql_col} AS v, count() AS c FROM request_facts WHERE\
    \ {where_clause} AND {sql_col} != '' GROUP BY v ORDER BY c DESC LIMIT 10\"\n \
    \       try:\n            rows = service.client.execute(q, params)\n         \
    \   return field, [(str(r[\"v\"]), int(r[\"c\"])) for r in rows]\n        except\
    \ Exception as e:\n            import logging\n\n            logging.getLogger(__name__).error(\"\
    FILTER ERROR field %s: %s\", field, e)\n            return field, []\n\n    with\
    \ concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:\n        field_results\
    \ = dict(ex.map(fetch_field, requested_fields))\n\n    try:\n        total_rows_result\
    \ = service.client.execute(\n            f\"SELECT count() AS c FROM request_facts\
    \ WHERE {where_clause}\", params\n        )\n        total_count = int(total_rows_result[0][\"\
    c\"]) if total_rows_result else 0\n    except Exception as e:\n        import\
    \ logging\n\n        logging.getLogger(__name__).error(\"FILTER ERROR total: %s\"\
    , e)\n        total_count = 0\n\n    data = {\n        field: FieldAggregate(\n\
    \            top=[FieldTopEntry(value=v, count=c) for v, c in top_values],\n \
    \           total=total_count,\n        )\n        for field, top_values in field_results.items()\n\
    \    }\n\n    map_data = [MapPoint(country=v, count=c) for v, c in field_results.get(\"\
    country\", [])]\n\n    time_series = []\n    if req.include_time_series is not\
    \ False:\n        interval_sql = \"toStartOfMinute(event_timestamp)\"\n      \
    \  if req.chart_interval == \"5 minute\":\n            interval_sql = \"toStartOfFiveMinutes(event_timestamp)\"\
    \n        elif req.chart_interval == \"1 hour\":\n            interval_sql = \"\
    toStartOfInterval(event_timestamp, INTERVAL 1 hour)\"\n        elif req.chart_interval\
    \ == \"1 day\":\n            interval_sql = \"toStartOfDay(event_timestamp)\"\n\
    \n        ts_q = f\"SELECT {interval_sql} AS bucket_start, count() AS value FROM\
    \ request_facts WHERE {where_clause} GROUP BY bucket_start ORDER BY bucket_start\"\
    \n        try:\n            ts_rows = service.client.execute(ts_q, params)\n \
    \           time_series = [TimeSeriesPoint(time=str(r[\"bucket_start\"]), value=float(r[\"\
    value\"])) for r in ts_rows]\n        except Exception:\n            time_series\
    \ = []\n\n    return AggregatesResponse.with_telemetry(\n        data=data,\n\
    \        time_series=time_series,\n        map_data=map_data,\n        where_clause=\"\
    high-scale ClickHouse (filtered)\",\n        interval=req.chart_interval,\n  \
    \      metric=req.chart_metric,\n        total_rows=total_count,\n        total_rows_total=total_count,\n\
    \        earliest_log_at=None,\n        latest_log_at=None,\n    )\n\n\ndef aggregates(service:\
    \ HighScaleService, req: AggregatesRequest, start_time: str | None, end_time:\
    \ str | None):\n    if req.filters:\n        return _filtered_aggregates(service,\
    \ req, start_time, end_time)\n\n    requested_fields = req.fields or list(_FIELD_DIMENSIONS)\n\
    \    responses = {\n        field: _aggregate(\n            service,\n       \
    \     start_time=start_time,\n            end_time=end_time,\n            dimension=_FIELD_DIMENSIONS[field],\n\
    \        )\n        for field in requested_fields\n        if field in _FIELD_DIMENSIONS\n\
    \    }\n    total = responses.get(\"url\")\n    if total is None:\n        total\
    \ = _aggregate(service, start_time=start_time, end_time=end_time, dimension=\"\
    url\")\n\n    data = {\n        field: FieldAggregate(\n            top=[FieldTopEntry(value=value,\
    \ count=count) for value, count in response.top_values],\n            total=response.request_count,\n\
    \        )\n        for field, response in responses.items()\n    }\n    map_response\
    \ = responses.get(\"country\")\n    map_data = (\n        [MapPoint(country=value,\
    \ count=count) for value, count in map_response.top_values]\n        if map_response\
    \ is not None\n        else []\n    )\n    time_series = _time_series(service,\
    \ start_time, end_time)\n    return AggregatesResponse.with_telemetry(\n     \
    \   data=data,\n        time_series=time_series,\n        map_data=map_data,\n\
    \        where_clause=\"high-scale ClickHouse\",\n        interval=req.chart_interval,\n\
    \        metric=req.chart_metric,\n        total_rows=total.request_count,\n \
    \       total_rows_total=total.request_count,\n        earliest_log_at=None,\n\
    \        latest_log_at=None,\n    )\n\n\ndef bundle(\n    service: HighScaleService,\n\
    \    req: AggregatesRequest,\n    start_time: str | None,\n    end_time: str |\
    \ None,\n) -> dict[str, Any]:\n    from backend.utils.telemetry import get_queries,\
    \ get_sqlite_queries, get_tracked_calls\n\n    res_aggregates = aggregates(service,\
    \ req, start_time, end_time)\n    res_top_bots = SecurityTopBotsResponse.with_telemetry(bots=[],\
    \ ngwaf_bots=[])\n\n    return {\n        \"aggregates\": res_aggregates,\n  \
    \      \"top_bots\": res_top_bots,\n        \"debug_queries\": get_queries(),\n\
    \        \"debug_calls\": get_tracked_calls(),\n        \"debug_sqlite\": list(get_sqlite_queries()),\n\
    \    }\n"
  sync_status.py: "\"\"\"Sync-status surface: cached snapshot reader, full /sync-status,\n\
    analyst-safe /log-extents, and /admin/ingested-files.\"\"\"\n\nfrom __future__\
    \ import annotations\n\nimport asyncio\nimport json\nimport logging\nimport os\n\
    from collections.abc import AsyncIterator\n\nfrom fastapi import APIRouter, Depends,\
    \ HTTPException, Query, Request\nfrom sse_starlette.sse import EventSourceResponse\n\
    \nfrom backend.deps import get_service_id, get_source\nfrom backend.models.admin\
    \ import IngestedFilesResponse, LogExtentsResponse, SyncStatusResponse\nfrom backend.models.errors\
    \ import DEFAULT_ERROR_RESPONSES\nfrom backend.sync_status_publisher import publisher\
    \ as sync_status_publisher\nfrom backend.utils.router_utils import SSE_PASSTHROUGH_HEADERS,\
    \ make_error, query_errors, raise_internal\nfrom backend.utils.sse_subscription\
    \ import iter_with_disconnect_ping\n\nlogger = logging.getLogger(__name__)\n\n\
    from ._dir_size import _get_dir_size\nfrom ._router import router\n\n# Dedicated\
    \ router for the analyst-safe sync-status siblings (/api/log-extents\n# + /stream).\
    \ FastAPI MERGES router-level and route-level tags, so a bare\n# ``tags=[\"meta\"\
    ]`` on the decorators would yield ``[\"admin\", \"meta\"]`` and\n# leave the misleading\
    \ \"admin\" audience signal the shared admin router stamps.\n# A separate router\
    \ carrying only the neutral \"meta\" tag is the clean way to\n# drop \"admin\"\
    \ while keeping the same /api paths and canonical error responses.\n# Runtime\
    \ audience is enforced by RemoteAccessMiddleware (path-based), not the\n# OpenAPI\
    \ tag, so this is a docs-only distinction. Included alongside\n# ``admin.router``\
    \ in backend/main.py.\nmeta_router = APIRouter(prefix=\"/api\", tags=[\"meta\"\
    ], responses=DEFAULT_ERROR_RESPONSES)\n\n\n# Implementation moved to backend/sync_status_snapshot.py\
    \ so cron jobs can\n# publish post-commit snapshots without a cron -> routers\
    \ import edge\n# (import-linter). Re-exported here for the historical import path;\
    \ tests\n# patch this module-level binding, so keep the name bound here.\nfrom\
    \ backend.sync_status_snapshot import compute_sync_status_cached  # noqa: E402,\
    \ F401\n\n\n@router.get(\"/sync-status\", response_model=SyncStatusResponse)\n\
    def sync_status(\n    service_id: str | None = Depends(get_service_id),\n    skip_fos:\
    \ bool = Query(default=False),\n    force: bool = Query(default=False),\n) ->\
    \ SyncStatusResponse:\n    from backend import config as svcconfig\n    from backend.core\
    \ import duckdb as _db\n    from backend.core.duckdb import get_sync_status\n\
    \    from backend.utils.telemetry import clear_queries\n\n    clear_queries()\n\
    \n    src: dict | None = None\n    if service_id:\n        src = _db.get_source_for_service(service_id)\n\
    \    if not src or not service_id:\n        resp_empty: SyncStatusResponse = SyncStatusResponse.with_telemetry(configured=False)\n\
    \        return resp_empty\n\n    try:\n        from backend.high_scale.registry\
    \ import get_high_scale_service_registry\n\n        high_scale_service = get_high_scale_service_registry().resolve(service_id)\n\
    \        if high_scale_service is not None:\n            cached = compute_sync_status_cached(service_id)\n\
    \            if cached is not None:\n                high_scale_response: SyncStatusResponse\
    \ = SyncStatusResponse.with_telemetry(**cached)\n                return high_scale_response\n\
    \n        # Fast path: skip_fos=true callers (FilterBar polling, badge in\n  \
    \      # the page header, etc.) only need the cached snapshot that the\n     \
    \   # sync cron refreshes every minute. Return it without grabbing a\n       \
    \ # DuckDB connection, so that a busy dashboard load \u2014 agg/raw/\n       \
    \ # bots all racing for connections \u2014 doesn't starve sync-status\n      \
    \  # and trigger 503s when its max_wait expires.\n        if skip_fos and not\
    \ force:\n            cached = compute_sync_status_cached(service_id)\n      \
    \      if cached is not None:\n                resp_cached: SyncStatusResponse\
    \ = SyncStatusResponse.with_telemetry(**cached)\n                return resp_cached\n\
    \n        from backend.core.duckdb import get_connection\n\n        is_durable\
    \ = svcconfig.is_durable_serving_mode(src)\n        _con = get_connection(source=src,\
    \ max_wait=5, skip_view_update=True, read_only=is_durable)\n        try:\n   \
    \         status = get_sync_status(_con, src, skip_fos=skip_fos, force=force)\n\
    \        finally:\n            _con.close()\n\n        db_path = src.get(\"duckdb_path\"\
    ) or svcconfig.duckdb_path(service_id)\n        db_exists = os.path.exists(db_path)\n\
    \        db_size = os.path.getsize(db_path) if db_exists else 0\n\n        cache_size\
    \ = _get_dir_size(_db._cache_dir(src))\n\n        status[\"duckdb_size_bytes\"\
    ] = db_size + cache_size\n        status[\"duckdb_exists\"] = db_exists\n\n  \
    \      from backend.cron_progress import get_latest_progress_for_service\n\n \
    \       active_run = get_latest_progress_for_service(service_id)\n        if active_run:\n\
    \            status[\"active_run\"] = active_run\n            status[\"busy\"\
    ] = True\n\n        cfg = svcconfig.load_config(service_id) or {}\n        status[\"\
    ngwaf_workspace_id\"] = cfg.get(\"ngwaf_workspace_id\")\n\n        resp: SyncStatusResponse\
    \ = SyncStatusResponse.with_telemetry(**status)\n        return resp\n    except\
    \ _db.DBBusyError as e:\n        raise HTTPException(status_code=503, detail=make_error(\"\
    db_busy\", str(e), busy=True))\n    except Exception as e:\n        raise_internal(logger,\
    \ e, code=\"sync_status_failed\")\n\n\n@meta_router.get(\"/log-extents\", response_model=LogExtentsResponse)\n\
    def log_extents(service_id: str | None = Depends(get_service_id)) -> LogExtentsResponse:\n\
    \    \"\"\"Return only the earliest/latest log timestamps for the FilterBar.\n\
    \n    Analyst-safe sibling of ``/api/sync-status``: same cached-status fast\n\
    \    path but projected down to the two fields the FilterBar actually\n    reads.\
    \ ``/api/sync-status`` is blocked for analysts because it leaks\n    ``ngwaf_workspace_id``\
    \ and active cron-task state; this endpoint\n    drops both, so the middleware\
    \ lets it through and the FilterBar's\n    snap-to-extents UX works for analysts\
    \ too.\n\n    Reads only the persisted status snapshot \u2014 no DuckDB connection\n\
    \    grabbed, no contention with cron, no 503 path. The snapshot is\n    refreshed\
    \ by the sync cron every minute so a freshly started\n    service sees populated\
    \ extents within ~60s.\n    \"\"\"\n    from backend import config as svcconfig\n\
    \    from backend.core import duckdb as _db\n\n    if not service_id:\n      \
    \  empty1: LogExtentsResponse = LogExtentsResponse.with_telemetry(configured=False)\n\
    \        return empty1\n    src = _db.get_source_for_service(service_id)\n   \
    \ if not src:\n        empty2: LogExtentsResponse = LogExtentsResponse.with_telemetry(configured=False)\n\
    \        return empty2\n\n    cached = svcconfig.get_status(src[\"name\"]) or\
    \ {}\n    request_status = cached.get(\"request\")\n    latest = request_status.get(\"\
    latest_log_at\") if isinstance(request_status, dict) else cached.get(\"latest_log_at\"\
    )\n    resp: LogExtentsResponse = LogExtentsResponse.with_telemetry(\n       \
    \ configured=True,\n        earliest_log_at=cached.get(\"earliest_log_at\"),\n\
    \        latest_log_at=latest,\n    )\n    return resp\n\n\n@meta_router.get(\"\
    /log-extents/stream\")\nasync def log_extents_stream(\n    request: Request,\n\
    \    service_id: str | None = Depends(get_service_id),\n) -> EventSourceResponse:\n\
    \    \"\"\"Analyst-safe SSE projection of the cached sync-status snapshot.\n\n\
    \    Re-uses the existing ``sync_status_publisher`` (the admin\n    ``/api/sync-status/stream``\
    \ endpoint subscribes to the same\n    publisher) but projects every payload down\
    \ to the two fields the\n    header badge actually renders \u2014 ``latest_log_at``\
    \ + ``local_rows``\n    \u2014 so analysts can receive real-time badge updates\
    \ without leaking\n    ``ngwaf_workspace_id``, ``active_run``, ``cdn_service_id``,\
    \ etc.\n\n    Path lives under ``/api/log-extents/*`` (the analyst-safe sibling\n\
    \    of ``/api/sync-status``) so middleware does NOT auto-block it.\n    Belt-and-suspenders:\
    \ also listed in ``_ANALYST_SSE_ALLOWLIST`` in\n    ``backend/utils/remote_access.py``\
    \ so the analyst-side firewall's\n    SSE-defaults-off policy documents this opening\
    \ explicitly.\n    \"\"\"\n    if not service_id:\n        raise HTTPException(status_code=422,\
    \ detail=make_error(\"x_service_id_required\"))\n\n    def _project(snap: dict\
    \ | None) -> dict | None:\n        if snap is None:\n            return None\n\
    \        return {\n            \"latest_log_at\": snap.get(\"latest_log_at\"),\n\
    \            \"local_rows\": snap.get(\"local_rows\"),\n            \"rum\": snap.get(\"\
    rum\"),\n            \"request\": snap.get(\"request\"),\n        }\n\n    async\
    \ def stream() -> AsyncIterator[str]:\n        # Initial snapshot so a freshly\
    \ mounted analyst page doesn't\n        # blank-flash waiting for the first cron\
    \ tick.\n        # compute_sync_status_cached touches disk (os.path.getsize +\n\
    \        # directory traversal via _get_dir_size); calling it directly on\n  \
    \      # the SSE coroutine stalled the asyncio event loop for the\n        # duration\
    \ of the I/O, denying service to every other concurrent\n        # request on\
    \ the same worker. Off-load to a worker thread.\n        initial = _project(await\
    \ asyncio.to_thread(compute_sync_status_cached, service_id))\n        if initial\
    \ is not None:\n            yield json.dumps(initial)\n\n        # Race the publisher\
    \ against disconnect detection \u2014 see\n        # backend.utils.sse_subscription.\
    \ Shields the long-lived\n        # __anext__() task across timeouts so the publisher\
    \ queue stays\n        # parked between pings (a bare wait_for would cancel the\n\
    \        # generator's q.get() and silently end the subscriber).\n        async\
    \ for payload in iter_with_disconnect_ping(\n            sync_status_publisher.subscribe(service_id),\
    \ request, ping_seconds=15\n        ):\n            projected = _project(payload)\n\
    \            if projected is not None:\n                yield json.dumps(projected)\n\
    \n    return EventSourceResponse(stream(), ping=5, headers=SSE_PASSTHROUGH_HEADERS)\n\
    \n\n@router.get(\"/admin/ingested-files\", response_model=IngestedFilesResponse)\n\
    @query_errors(status_code=500)\ndef ingested_files(source: dict = Depends(get_source))\
    \ -> IngestedFilesResponse:\n    from backend.core.duckdb import get_ingested_files\n\
    \n    res = get_ingested_files(None, source)\n    response: IngestedFilesResponse\
    \ = IngestedFilesResponse.with_telemetry(files=res)\n    return response\n"
