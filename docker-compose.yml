# Local quickstart: `docker compose up --build`, then open http://localhost
# (also http://fastly.localhost with zero setup; http://fastly.analytics with a
# /etc/hosts entry — see README).
#
# Topology: Caddy is the single ingress on :80. The `frontend` and `caddy`
# services join the `backend` container's network namespace
# (network_mode: "service:backend"), so all three share one loopback. That
# reproduces the production trust model — Caddy/frontend reach the backend on
# 127.0.0.1, so the backend sees a loopback peer and treats the request as the
# local admin (backend/utils/remote_access.py:is_request_remote). Shared
# namespaces work identically on native Docker and Colima across Mac/PC/Linux;
# production (docker-compose.prod.yml) overrides this to network_mode: host.
services:
  backend:
    image: fastly-log-analytics-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Run tini as PID 1 so orphaned children are reaped. uvicorn is not an
    # init: a zombie child makes `docker stop` fail ("PID is zombie and can
    # not be killed"), aborting force-recreate and the deploy under set -e.
    init: true
    restart: unless-stopped
    # Give the backend up to 75s to drain on SIGTERM before Docker SIGKILLs.
    # Pairs with _bounded_scheduler_shutdown in backend/main.py (60s scheduler
    # drain budget + 15s uvicorn / connection-close headroom). Without this
    # bump, the default 10s sigkill window cuts ingest crons mid-chunk on
    # every restart, producing partial buffers + orphan in_flight rows that
    # _recover_in_flight then has to reconcile on the next boot.
    stop_grace_period: 75s
    # Backend owns the shared network namespace, so it publishes the only
    # externally-reachable port: Caddy's :80 (Caddy runs inside this netns).
    # The frontend (:3000) and backend (:8000) stay internal — reach the app
    # through Caddy at http://localhost.
    ports:
      - "80:80"
    volumes:
      - ./configs:/app/configs
      - ./scripts:/app/scripts
      - backend-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # Friendly local hostnames added to the backend's Host allowlist
      # (localhost / 127.0.0.1 are allowed by default). fastly.localhost
      # auto-resolves to 127.0.0.1 in browsers; fastly.analytics needs a
      # /etc/hosts entry (see README). See backend/utils/remote_access.py.
      - LOCAL_HOSTS=${LOCAL_HOSTS:-fastly.localhost,fastly.analytics}
      - ADMIN_GATEWAY_SECRET=${ADMIN_GATEWAY_SECRET:-}
      - ADMIN_GATEWAY_REQUIRED=${ADMIN_GATEWAY_REQUIRED:-}
      # Caddy is the single ingress and connects to the backend over loopback
      # (shared netns, 127.0.0.1:8000) — same posture as docker-compose.prod.yml.
      # uvicorn's default --proxy-headers/--forwarded-allow-ips=127.0.0.1 already
      # populates request.client.host from XFF for the loopback peer; setting
      # these records that the trust is configured and clears the startup
      # proxy-headers WARNING. Kept NON-fatal here (REQUIRE_PROXY_HEADERS is
      # prod-only) so a localhost run still boots if someone removes them.
      - TRUSTED_PROXY_IPS=127.0.0.1
      - UVICORN_FORWARDED_ALLOW_IPS=127.0.0.1
      # Admin trust for this containerized topology: nothing reaches the
      # backend over loopback here (operator traffic lands as the docker
      # gateway IP), so the isolated compose subnet is declared admin-trusted.
      - LOCAL_ADMIN_CIDRS=172.29.0.0/16
      - FLA_PRODUCTION=${FLA_PRODUCTION:-0}
      - DEBUG_RESPONSES=${DEBUG_RESPONSES:-true}
      - METADATA_DSN=postgresql://fla:${POSTGRES_PASSWORD:-fla_local_dev}@postgres:5432/fla
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - HIGH_SCALE_CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - CLICKHOUSE_ENABLED=true
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-fla}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-fla_local_dev}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-fla}
      - CLICKHOUSE_SECURE=${CLICKHOUSE_SECURE:-false}
      - HIGH_SCALE_ENABLED=1
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  worker:
    image: fastly-log-analytics-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    restart: unless-stopped
    command: ["python", "-m", "backend.high_scale.worker"]
    mem_limit: 2g
    memswap_limit: 2g
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    volumes:
      - ./configs:/app/configs
      - backend-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - FLA_PRODUCTION=${FLA_PRODUCTION:-0}
      - HIGH_SCALE_ENABLED=1
      - HIGH_SCALE_WORKER_THREADS=1
      - HIGH_SCALE_MAX_BATCH_BYTES=6291456
      - HIGH_SCALE_MAX_BATCH_OBJECTS=10
      - METADATA_DSN=postgresql://fla:${POSTGRES_PASSWORD:-fla_local_dev}@postgres:5432/fla
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - HIGH_SCALE_CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://clickhouse:8123}
      - CLICKHOUSE_ENABLED=true
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-fla}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-fla_local_dev}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-fla}
      - CLICKHOUSE_SECURE=${CLICKHOUSE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q backend.high_scale.worker /proc/[0-9]*/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  frontend:
    extends:
      file: docker-compose.common.yml
      service: frontend
    # Share the backend's network namespace so the frontend's SSR fetches and
    # the Next.js /api rewrite reach the backend on loopback (127.0.0.1:8000) —
    # the address the backend trusts as local admin. No `ports`/`networks` here:
    # a service using network_mode: "service:..." inherits the owner's network.
    network_mode: "service:backend"
    environment:
      # Loopback in the shared namespace (NOT backend:8000 — a service-name
      # address would resolve to the bridge IP and be classified remote → 400).
      - API_PROXY_URL=http://127.0.0.1:8000
      - ADMIN_GATEWAY_SECRET=${ADMIN_GATEWAY_SECRET:-}
      - ADMIN_GATEWAY_REQUIRED=${ADMIN_GATEWAY_REQUIRED:-}
      - COMMIT_HASH=${COMMIT_HASH:-unknown}
      - ENV_NAME=local
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    extends:
      file: docker-compose.common.yml
      service: caddy
    # Also joins the backend's namespace: Caddy proxies to 127.0.0.1:3000
    # (frontend) and 127.0.0.1:8000 (backend) over that shared loopback.
    network_mode: "service:backend"
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend

  postgres:
    extends:
      file: docker-compose.common.yml
      service: postgres
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      timeout: 5s
    networks:
      - app-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-fla}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-fla}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-fla_local_dev}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  backend-data:
  postgres-data:
  clickhouse-data:
