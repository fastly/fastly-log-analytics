# Production overlay for GCE deployment behind Caddy.
#
# Usage on the VM:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Local dev is unaffected: `docker compose up -d` uses only the base file.
#
# Network model (hardened):
#   All three services run on the host network. Backend and frontend bind to
#   127.0.0.1 ONLY — nothing on the public interface, nothing reachable from
#   neighboring tenants or scanners. Caddy listens on 0.0.0.0:80 (the only
#   externally-facing socket) and proxies to 127.0.0.1:8000 (backend) and
#   127.0.0.1:3000 (frontend) on the same network namespace.
#
#   Why all-loopback for app services:
#     - Eliminates the "listening on 0.0.0.0" surface even if a firewall rule
#       were ever misconfigured.
#     - Backend reads request.client.host as the trust signal. uvicorn runs
#       with --proxy-headers --forwarded-allow-ips=127.0.0.1 so it populates
#       request.client.host from X-Forwarded-For ONLY when the TCP peer is
#       loopback (i.e. only Caddy on this host can set it). Caddy rewrites
#       XFF to the authoritative Fastly-Client-IP value before forwarding,
#       so request.client.host is the real client IP for Caddy-proxied
#       traffic and 127.0.0.1 for direct SSH-tunnel admin access.
#
# Public exposure:
#   Only port 80 is open on the VM's public interface, and the GCP firewall
#   restricts it to Fastly's published origin IP ranges. Caddy additionally
#   refuses to trust the Fastly-Client-IP header unless the TCP peer is in
#   Fastly's published edge range (defense-in-depth against any firewall
#   misconfiguration).

x-prod-logging: &prod-logging
  # Extra E2 (security remediation v6): the default Docker json-file driver
  # has no size cap and no rotation. A container that's been up for months
  # can either run the host disk to zero or, conversely, lose months of
  # access-log history every time the container is restarted (which kills
  # any retroactive incident-response investigation). Cap each file at
  # 50 MB and keep 10 rotated files — gives us ~500 MB / container with a
  # multi-week retention window even on chatty endpoints. Adjust if disk
  # pressure ever becomes a concern.
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"
    compress: "true"

services:
  backend:
    network_mode: host
    ports: !reset []
    networks: !reset null
    logging: *prod-logging
    # Override the default '--host 0.0.0.0' → bind to loopback only.
    #
    # --proxy-headers + --forwarded-allow-ips=127.0.0.1 (security):
    # tells uvicorn to populate request.client.host from X-Forwarded-For ONLY
    # when the TCP peer is loopback (i.e., only Caddy on this same host can
    # set it). Caddy rewrites XFF to the authoritative Fastly-Client-IP value
    # before forwarding, so request.client.host is the real client IP for
    # remote traffic and 127.0.0.1 for direct SSH-tunnel admin access. Without
    # both flags, leftmost-XFF spoofing becomes exploitable AND
    # the admin Host-spoof bypass returns. Do not remove without first
    # rewriting backend/utils/remote_access.py:is_request_remote — the startup
    # assertion in backend/main.py will FATAL-exit otherwise.
    command:
      [
        "uvicorn",
        "backend.main:app",
        "--host",
        "127.0.0.1",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips=127.0.0.1",
      ]
    # Container-level memory cap. Pre-2026-06-04 this was unset (Memory: 0
     # = unlimited) — the backend was free to grow until the kernel OOM-
    # killer fired on the WHOLE host. That took out sshd + caddy on each
    # OOM event (witnessed 2026-06-01 + multiple times on 2026-06-03/04).
    # 12g leaves ~3GB host headroom; when the backend genuinely runs
    # away docker SIGKILLs only the backend (clean restart-unless-stopped
    # recovery) instead of wedging the whole VM.
    mem_limit: 12g
    memswap_limit: 12g
    # Without an explicit ulimit, Docker inherits the daemon default (often
    # 1024 soft). main.py bumps the soft limit at startup via
    # resource.setrlimit, but that call silently no-ops when Docker's hard
    # limit is already at or below the target. Setting both here ensures the
    # hard limit is reachable so the startup bump actually takes effect.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # Hard-fail at startup if /app/data isn't a real mount point. Guards
      # against the broken-fstab failure mode (data accidentally written to
      # an ephemeral boot-disk stub). See _enforce_data_dir_mounted in main.py.
      - STRICT_DATA_DIR_CHECK=1
      # Companion to the uvicorn command flags above: the startup assertion in
      # backend/main.py reads this and refuses to boot if it is unset or empty.
      # Prevents silent regression to leftmost-XFF spoofing if a
      # future config refactor drops the --proxy-headers flag.
      - TRUSTED_PROXY_IPS=127.0.0.1
      # Escalate _enforce_proxy_headers_configured from WARNING to FATAL.
      # In prod this guard MUST be fatal — a config refactor that drops
      # the trusted-proxy env should refuse to boot rather than silently
      # serve requests with leftmost-XFF spoofing exploitable.
      - REQUIRE_PROXY_HEADERS=1
      # uvicorn's own env-equivalent of the --forwarded-allow-ips CLI flag.
      # Defense-in-depth: if a future refactor drops the CLI flag, the
      # startup assertion in backend/main.py still has a signal to detect
      # the unsafe state via this companion variable.
      - UVICORN_FORWARDED_ALLOW_IPS=127.0.0.1
      # Pass through DEBUG_RESPONSES from the host environment (defaults to true).
      - DEBUG_RESPONSES=${DEBUG_RESPONSES:-true}
      # Graceful self-restart before the 12g cgroup OOM-SIGKILL: when RSS
      # crosses 9000MB (~3GB headroom for the graceful drain) the backend
      # SIGTERMs itself, uvicorn exits 0, and restart:unless-stopped brings up
      # a fresh process. Set to 0 to disable.
      - BACKEND_GRACEFUL_RESTART_RSS_MB=9000
      # Allocator tuning passthrough. The Dockerfile bakes the production
      # default (jemalloc background purge + 5s decay). Keep this default
      # byte-for-byte in sync with backend/Dockerfile's MALLOC_CONF; an empty
      # .env resolves to it, so a fresh clone carries zero profiling overhead.
      - MALLOC_CONF=${MALLOC_CONF:-background_thread:true,dirty_decay_ms:5000,muzzy_decay_ms:5000}
      # CORS allowlist for browser-origin XHR. The analyst SPA is same-
      # origin behind Caddy so this is defense-in-depth — without it the
      # FastAPI default falls back to a dev allowlist (localhost:3000/3001/
      # 13002) that has no business being live in prod. Pinning to the
      # actual public_endpoint here means any future cross-origin caller
      # is rejected by CORS preflight regardless of SameSite/Origin
      # gating. Set the value in the VM-side .env file (it isn't repo-
      # safe — fastly-log-analytics is a public repo).
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Real-User-Monitoring (Web Vitals) collection. OFF by default for
      # every install — collection is opt-in (see
      # backend/core/request_telemetry/instruments.py). Enable it on a SPECIFIC machine by
      # setting WEB_VITALS_COLLECT=1 in the VM-side .env file (not repo-
      # tracked), the same passthrough pattern CORS_ORIGINS uses. Unset/empty
      # here resolves to the code's default-off path, so a fresh clone never
      # collects until its operator explicitly opts in. Enabled samples land in
      # /app/data/system/web_vitals.jsonl for scripts/analyze_web_vitals.py.
      - WEB_VITALS_COLLECT=${WEB_VITALS_COLLECT:-}
      # OpenTelemetry export is opt-in. Keep the production default at
      # `none`; an operator enabling OTLP must provide both destinations in
      # the VM-local .env. No endpoint or credentials belong in this file.
      - OTEL_EXPORTER=${OTEL_EXPORTER:-none}
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      # Analyst OAuth/OIDC login (opt-in; same VM-.env passthrough pattern as
      # CORS_ORIGINS). ALL empty by default → the feature stays OFF: it is
      # inert unless OAUTH_FLOW_STATE_SECRET is set AND a provider is configured
      # in the gitignored registry (default /app/data/system/oauth_providers.json,
      # i.e. /mnt/app-data/data/system/ on the host). The client_id/secret are the
      # Google "Web application" client's; keep them out of the repo (VM .env only).
      # OAUTH_REDIRECT_BASE pins the exact callback origin registered at the IdP
      # (empty → derived from the tunnel public_endpoint).
      - OAUTH_FLOW_STATE_SECRET=${OAUTH_FLOW_STATE_SECRET:-}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_BASE=${OAUTH_REDIRECT_BASE:-}
      # SSO-exclusive deployments only: set to 0 to disable passcode login.
      - SHARE_PASSCODE_LOGIN_ENABLED=${SHARE_PASSCODE_LOGIN_ENABLED:-}
      # PostgreSQL operational metadata + ClickHouse analytical store (unified v3 storage).
      # Points to the local containers on loopback with fallback password.
      - METADATA_DSN=postgresql://fla:${POSTGRES_PASSWORD:-fla_local_dev}@127.0.0.1:5432/fla
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://127.0.0.1:8123}
      - HIGH_SCALE_CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://127.0.0.1:8123}
      - CLICKHOUSE_ENABLED=true
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-127.0.0.1}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-fla}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-fla_local_dev}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-fla}
      - CLICKHOUSE_SECURE=${CLICKHOUSE_SECURE:-false}
    depends_on:
      - postgres
      - clickhouse
    volumes: !override
      - /mnt/app-data/configs:/app/configs
      - /mnt/app-data/data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://127.0.0.1:8000/api/health?deep=1&stale_minutes=180' | grep -q '^{\"status\":\"ok\"'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25m

  worker:
    network_mode: host
    ports: !reset []
    networks: !reset []
    logging: *prod-logging
    command: ["python", "-m", "backend.high_scale.worker"]
    mem_limit: 2g
    memswap_limit: 2g
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    environment:
      - PYTHONUNBUFFERED=1
      - HIGH_SCALE_WORKER_THREADS=1
      - HIGH_SCALE_MAX_BATCH_BYTES=6291456
      - HIGH_SCALE_MAX_BATCH_OBJECTS=10
      - METADATA_DSN=postgresql://fla:${POSTGRES_PASSWORD:-fla_local_dev}@127.0.0.1:5432/fla
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://127.0.0.1:8123}
      - HIGH_SCALE_CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://127.0.0.1:8123}
      - CLICKHOUSE_ENABLED=true
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-127.0.0.1}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-fla}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-fla_local_dev}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-fla}
      - CLICKHOUSE_SECURE=${CLICKHOUSE_SECURE:-false}
    depends_on:
      - postgres
      - clickhouse
    volumes: !override
      - /mnt/app-data/configs:/app/configs
      - /mnt/app-data/data:/app/data

  frontend:
    network_mode: host
    ports: !reset []
    networks: !reset null
    logging: *prod-logging
    environment:
      # Bind Next.js standalone server to loopback only (overrides Dockerfile's
      # HOSTNAME=0.0.0.0).
      - HOSTNAME=127.0.0.1
      - API_PROXY_URL=http://127.0.0.1:8000
      - COMMIT_HASH=${COMMIT_HASH:-unknown}
      - ENV_NAME=gce

  caddy:
    # Custom build with the caddy-ratelimit plugin (see caddy/Dockerfile).
    # Distinct image name (NOT the base compose file's `caddy:2-alpine`):
    # the Dockerfile does `FROM caddy:2-alpine`, so if the build output
    # reused that tag it would overwrite the base with our image — whose
    # last line is `USER caddy`. The next rebuild's FROM would then resolve
    # to our own non-root image and every privileged step (apk/addgroup/
    # setcap) would fail ("permission denied (are you root?)"). A separate
    # tag keeps FROM always pointing at the official root base.
    image: caddy-ratelimit:2-alpine
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    network_mode: host
    ports: !reset []
    networks: !reset []
    logging: *prod-logging
    # Docker's default SIGKILL window is 10s. The Caddyfile sets a 120s
    # read_timeout on /api/* to cover slow analytical queries. Without a grace
    # period, a rolling deploy SIGKILLs Caddy while it's still proxying an
    # in-flight request. 15s covers the vast majority of non-streaming
    # responses and lets Caddy drain cleanly before the new container starts.
    stop_grace_period: 15s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    ports: !reset []
    networks: !reset []
    logging: *prod-logging
    # Security: bind to loopback ONLY — not reachable on public or VPC interfaces.
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    environment:
      - POSTGRES_USER=fla
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fla_local_dev}
      - POSTGRES_DB=fla
    volumes: !override
      - /mnt/app-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fla -d fla"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    network_mode: host
    ports: !reset []
    networks: !reset []
    logging: *prod-logging
    mem_limit: 4g
    memswap_limit: 4g
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-fla}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-fla}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-fla_local_dev}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes: !override
      - /mnt/app-data/clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  caddy_data:
  caddy_config:
