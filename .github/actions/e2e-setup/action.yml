name: E2E Setup
description: Install uv, Python backend deps, Node 24, frontend deps, and cached Playwright browser.

inputs:
  browser:
    description: Playwright browser project to install (chromium, firefox, webkit)
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
        python-version: "3.13"

    - name: Install backend deps
      shell: bash
      run: uv sync

    - name: Setup Node
      # Aligned with ci.yml (Node 24 + setup-node@v7) — package.json
      # declares `engines.node: ">=24"`, so Node 22 here would silently
      # run Playwright on an unsupported version.
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend deps
      shell: bash
      run: cd frontend && npm ci

    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: echo "version=$(cd frontend && npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browser }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browser (${{ inputs.browser }}) + system deps
      shell: bash
      run: cd frontend && npx playwright install --with-deps ${{ inputs.browser }}
